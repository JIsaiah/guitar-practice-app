<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新しいセッション (試作)</title>
<link rel="stylesheet" href="../generated/tokens.css">
<link rel="stylesheet" href="common.css">
<style>
  .page { display: flex; flex-direction: column; gap: var(--space-lg); max-width: 760px; margin: 0 auto; padding: var(--space-xxl); }
  .top { display: flex; align-items: center; gap: var(--space-md); }
  .top h1 { margin: 0; font-size: var(--font-size-heading); font-weight: 600; }

  .step { display: grid; grid-template-columns: 40px 1fr; gap: var(--space-md); padding: var(--space-lg); }
  .step .no {
    width: 32px; height: 32px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--color-border);
    font-weight: 700;
  }
  .step.done .no { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }
  .step h2 { margin: 0 0 var(--space-sm); font-size: var(--font-size-body); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
  .chosen { margin-top: var(--space-sm); font-size: var(--font-size-caption); }

  .tones { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-sm); }
  .tone {
    display: flex; flex-direction: column; gap: var(--space-xs);
    padding: var(--space-md);
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-surface);
    text-align: left; cursor: pointer;
  }
  .tone[aria-pressed="true"] { border-color: var(--color-accent); border-width: 2px; }
  .tone b { font-size: var(--font-size-title); }
  .tone span { font-size: var(--font-size-caption); color: var(--color-text-muted); white-space: normal; }
  .tone[aria-pressed="true"] span { color: var(--color-on-accent); }   /* 塗りの上では補助の文字色を使わない */
  .tone { min-height: 72px; }

  .bpm { display: flex; align-items: center; gap: var(--space-lg); }
  .bpm .value { font-size: var(--font-size-display); line-height: 1; }
  .actions { display: flex; justify-content: flex-end; gap: var(--space-md); }
  input[type="text"] {
    width: 100%; min-height: var(--size-button-height); padding: 0 var(--space-md);
    border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    background: var(--color-background);
  }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <h1>新しいセッション</h1>
  </header>

  <section class="step surface done">
    <div class="no">1</div>
    <div>
      <h2>音源</h2>
      <div class="row">
        <button class="btn">ファイルを選ぶ…</button>
        <button class="btn">YouTube の URL を貼り付け</button>
      </div>
      <div class="chosen muted">YouTube: https://www.youtube.com/watch?v=xxxxxxxxxxx</div>
      <div style="margin-top: var(--space-md)">
        <input type="text" value="Sweet Child O' Mine イントロ" aria-label="曲名">
      </div>
    </div>
  </section>

  <section class="step surface">
    <div class="no">2</div>
    <div>
      <h2>タブ譜 <span class="muted">(なくてもよい)</span></h2>
      <div class="row"><button class="btn">ファイルを選ぶ…</button><span class="muted">選んでいません</span></div>
    </div>
  </section>

  <section class="step surface done">
    <div class="no">3</div>
    <div>
      <h2>音色</h2>
      <div class="tones seg">
        <button class="tone" aria-pressed="false"><b>クリーン</b><span>澄んだ音。アルペジオに</span></button>
        <button class="tone" aria-pressed="true"><b>クランチ</b><span>軽い歪み。ロックのバッキングに</span></button>
        <button class="tone" aria-pressed="false"><b>歪み</b><span>強い歪み。リフとソロに</span></button>
      </div>
    </div>
  </section>

  <section class="step surface done">
    <div class="no">4</div>
    <div>
      <h2>テンポの確認</h2>
      <div class="bpm">
        <div class="wheel" data-min="40" data-max="300" data-step="1" title="ホイールで変える">
          <span class="value num">126</span>
        </div>
        <span class="muted">BPM (タブ譜から)</span>
        <button class="btn btn-large">TAP</button>
      </div>
    </div>
  </section>

  <div class="actions">
    <button class="btn btn-large" onclick="location.href='session-list.html'">やめる</button>
    <button class="btn btn-primary btn-large" onclick="location.href='practice.html'">練習を始める</button>
  </div>
</main>
<script src="common.js"></script>
</body>
</html>
