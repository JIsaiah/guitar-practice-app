<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>セッション一覧 (試作)</title>
<link rel="stylesheet" href="../generated/tokens.css">
<link rel="stylesheet" href="common.css">
<style>
  /* 置くのは「新しいセッション」、カード、設定の3つだけ (設計書 4.6) */
  .page {
    display: flex;
    flex-direction: column;
    gap: var(--space-xl);
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-xxl);
  }
  .top {
    display: flex;
    align-items: center;
    gap: var(--space-lg);
  }
  .top h1 {
    flex: 1;
    margin: 0;
    font-size: var(--font-size-heading);
    font-weight: 600;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--size-card-min-width), 1fr));
    gap: var(--space-lg);
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    padding: var(--space-lg) var(--space-lg) var(--space-md);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    text-align: left;
    cursor: pointer;
    transition: transform var(--motion-duration) ease-out;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--color-accent); }
  .card .title {
    font-size: var(--font-size-title);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-sm);
  }
  .tag {
    padding: 0 var(--space-sm);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-caption);
    color: var(--color-text-muted);
  }
  .speed { font-size: var(--font-size-heading); line-height: 1; }
  .speed small { font-size: var(--font-size-body); color: var(--color-text-muted); }
  .last { font-size: var(--font-size-caption); color: var(--color-text-muted); }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <h1>セッション</h1>
    <button class="btn btn-primary btn-large" onclick="location.href='new-session.html'">＋ 新しいセッション</button>
    <button class="btn btn-icon" title="設定" aria-label="設定" onclick="location.href='settings.html'">⚙</button>
  </header>

  <!-- 最後に練習した順。カードを押すと、確認なしで練習画面へ -->
  <section class="cards" id="cards"></section>
</main>

<script src="common.js"></script>
<script>
  const sessions = [
    { title: "Hotel California (ソロ)",       source: "ファイル", last: "今日 21:40",  speed: 80 },
    { title: "Sweet Child O' Mine イントロ", source: "YouTube",  last: "昨日 22:15",  speed: 70 },
    { title: "Little Wing",                  source: "ファイル", last: "10月28日",    speed: 100 },
    { title: "紅蓮華 (バッキング)",           source: "YouTube",  last: "10月25日",    speed: 90 },
    { title: "スケール練習 Aマイナー",         source: "ファイル", last: "10月20日",    speed: 60 },
  ];

  const stagger = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--motion-stagger"));
  const maxTotal = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--motion-max-total"));
  const duration = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--motion-duration"));
  const cards = document.getElementById("cards");

  sessions.forEach((s, i) => {
    const card = document.createElement("button");
    card.className = "card rise-in";
    // 全体が maxTotal に収まるように、遅れを詰める。動きの途中でもクリックできる (opacity と transform だけなので)
    card.style.animationDelay = Math.min(i * stagger, Math.max(0, maxTotal - duration)) + "ms";
    card.innerHTML = `
      <div class="title"></div>
      <div class="meta"><span class="tag"></span><span class="last"></span></div>
      <div class="speed num">${s.speed}<small>% 前回の速度</small></div>`;
    card.querySelector(".title").textContent = s.title;
    card.querySelector(".tag").textContent = s.source;
    card.querySelector(".last").textContent = "最後に練習: " + s.last;
    card.addEventListener("click", () => location.href = "practice.html");
    cards.appendChild(card);
  });
</script>
</body>
</html>
