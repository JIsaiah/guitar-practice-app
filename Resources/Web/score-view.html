<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- タブ譜の表示 (設計書 #5、PoC-3)。alphaTab (MPL-2.0) で描く。ファイルはすべてアプリに同梱し、ネットから読まない -->
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--color-surface); color: var(--color-text);
               font-family: var(--font-ui); font-size: var(--font-size-body); }
  /* タブ譜の上で、ドラッグで文字が選ばれて (青く反転して) ハイライトされたり、それで画面がスクロールしたりしないように */
  html, body, #scroller, #score { user-select: none; -webkit-user-select: none; }
  #scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
  /* ラジアルメニュー (アプリ側) を出している間: マウスではスクロールさせず、タブ譜にマウスの操作を渡さない */
  #scroller.frozen { overflow-y: hidden; }
  /* スクロールバー: 細く、目立たない形 (作者の指示)。溝は透明で、つまみだけを丸く出す。上下の矢印は出さない。
     つまみは薄い色 (75%)。ふだんは隠し、ホイールを回したとき・スクロールバーの近くでマウスを動かしたときだけ出して、
     2 秒動かさなければ消す (下のスクリプトが scrolling を付け外しする) */
  #scroller::-webkit-scrollbar { width: 6px; }
  #scroller::-webkit-scrollbar-track { background: transparent; }
  #scroller::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  #scroller.scrolling::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-border) 75%, transparent); }
  #scroller.scrolling::-webkit-scrollbar-thumb:hover,
  #scroller.scrolling::-webkit-scrollbar-thumb:active { background: color-mix(in srgb, var(--color-text-muted) 75%, transparent); }
  #scroller::-webkit-scrollbar-button { display: none; height: 0; }
  #scroller.frozen #score { pointer-events: none; }
  #score { position: relative; }
  /* PDF のタブ譜 (作者の指示)。ページを横幅いっぱいの画像にして縦に並べ、再生中は画面を上から下へ流す (針は出さない) */
  #pdf { position: relative; display: none; padding: 8px 0 40vh; }
  #pdf canvas { display: block; margin: 0 auto 12px; background: #fff; box-shadow: 0 0 0 1px var(--color-border); }
  #cursor { position: absolute; width: 3px; border-radius: 2px; background: var(--color-accent);
            opacity: 0; transition: opacity 0.15s; pointer-events: none; z-index: 5; }
  #barHighlight { position: absolute; background: var(--color-accent); opacity: 0; pointer-events: none; z-index: 4; }
  #message { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             color: var(--color-text-muted); text-align: center; padding: 24px; box-sizing: border-box; }
  /* 再生前のカウントダウン (setlist-mode.md 7.2)。離れた位置からでも読める大きさ。
     すぐに始めるのはアプリの再生ボタンの2回押し。クリックは受けない (下のタブ譜をそのまま触れる) */
  #countdown { position: absolute; inset: 0; z-index: 100; display: none; flex-direction: column;
               align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45);
               pointer-events: none; user-select: none; }
  #countdown .number { font-size: min(55vh, 280px); font-weight: 700; line-height: 1; color: #fff;
                       font-family: var(--font-numeric), var(--font-ui); text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); }
  #countdown .caption { margin-top: 16px; font-size: 26px; font-weight: 700; color: #fff; text-align: center;
                        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
  #countdown .hint { margin-top: 8px; font-size: 15px; color: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
<div id="message">タブ譜を準備しています…</div>
<div id="scroller"><div id="score"></div><div id="pdf"></div></div>
<div id="countdown"><div class="number"></div><div class="caption"></div><div class="hint">▶ をもう一度押すと、すぐに始めます</div></div>
<script src="alphatab/alphaTab.min.js"></script>
<script>
  function send(type, data) {
    if (window.__JUCE__ && window.__JUCE__.backend)
      window.__JUCE__.backend.emitEvent("score", Object.assign({ type: type }, data || {}));
  }
  // 再生前のカウントダウン。number が 0 で caption だけなら「読み込み中…」などの文字だけ、両方なければ消す
  function showCountdown(number, caption) {
    const c = document.getElementById("countdown");
    c.querySelector(".number").textContent = number > 0 ? number : "";
    c.querySelector(".number").style.display = number > 0 ? "" : "none";
    c.querySelector(".hint").style.display = number > 0 ? "" : "none";
    c.querySelector(".caption").textContent = caption || "";
    c.style.display = number > 0 || caption ? "flex" : "none";
  }

  function showMessage(text) {
    const m = document.getElementById("message");
    m.textContent = text;
    m.style.display = text ? "flex" : "none";
  }

  const scroller = document.getElementById("scroller");

  // スクロールバーを出すのは、使う人が動かしたときだけ (再生中の自動スクロールでは出さない)。2 秒動かさなければ消す
  let scrollbarTimer = 0;
  // Chromium は、クラスを変えただけではスクロールバーを描き直さないことがあるので、同じ瞬間に作り直させる
  // (スクロールの位置は変わらない。画面にも出ない)
  function setScrollbarShown(shown) {
    if (scroller.classList.contains("scrolling") === shown) return;
    scroller.classList.toggle("scrolling", shown);
    scroller.style.overflowY = "hidden";
    void scroller.offsetWidth;
    scroller.style.overflowY = "";
  }
  function showScrollbar() {
    setScrollbarShown(true);
    clearTimeout(scrollbarTimer);
    scrollbarTimer = setTimeout(function () { setScrollbarShown(false); }, 2000);
  }
  function nearScrollbar(e) { return e.clientX >= scroller.getBoundingClientRect().right - 16; }
  scroller.addEventListener("wheel", showScrollbar, { passive: true });
  scroller.addEventListener("pointermove", function (e) { if (nearScrollbar(e) || e.buttons) showScrollbar(); });
  scroller.addEventListener("pointerdown", function (e) { if (nearScrollbar(e)) showScrollbar(); });
  const scoreElement = document.getElementById("score");
  const cursor = document.createElement("div"); cursor.id = "cursor";
  const barHighlight = document.createElement("div"); barHighlight.id = "barHighlight";

  let api = null, score = null, colours = null;
  // 小節は「演奏する順」に並べる (繰り返し記号・1番かっこ 2番かっこを展開したもの)。
  // タブ譜の音 (MIDI) は alphaTab がこの順で鳴らすので、針・小節のクリック・アプリのループもこの順で数える
  let barStartBeats = [];   // 演奏する順の小節の始まりの拍 (4分音符の数)
  let barIndex = [];        // 演奏する順の小節が、楽譜の何番目の小節か (0 から。針を置く場所)
  let scoreEndBeats = 0;    // 曲の終わりの拍

  function createApi() {
    api = new alphaTab.AlphaTabApi(scoreElement, {
      core: { fontDirectory: "/alphatab/font/", useWorkers: false },
      // タブ譜の音 (MIDI)。alphaTab の音源 (SONiVOX の SoundFont、同梱) で鳴らす。
      // 再生の位置・止める・始めるは、アプリの時計に合わせてこのページが行う (syncMidi)。alphaTab のカーソルは使わない
      player: { playerMode: alphaTab.PlayerMode.EnabledSynthesizer, soundFont: "/alphatab/soundfont/sonivox.sf2",
                enableCursor: false, enableAnimatedBeatCursor: false, enableUserInteraction: false },
      display: { staveProfile: "tab", scale: 1.0, resources: colourResources() }
    });

    api.scoreLoaded.on(function (s) {
      score = s;
      // タブ譜の音を、エレキギター (MIDI の 29 番: オーバードライブ・ギター) にする。
      // タブ譜のファイルによっては、アコースティックギターやナイロン弦になっていて、エレキらしく聞こえないため。
      // alphaTab は、この知らせのあとで MIDI を作るので、ここで変えれば効く
      for (const t of s.tracks)
        if (isGuitar(t) && t.playbackInfo) t.playbackInfo.program = 29;
      applyLayout();   // 描く前に、小節の幅の決め方を設定する
      // 演奏する順の小節と、それぞれが何拍目から始まるかを求めておく (テンポは一定とみなす。設計書 3.1 の「一定テンポ」)
      computePlayOrder(s);
      send("loaded", {
        title: s.title || "", artist: s.artist || "", tempo: s.tempo || 0,
        bars: barStartBeats,   // 演奏する順の各小節が、曲の頭から何拍目で始まるか (アプリがループを小節の頭に合わせるのに使う)
        barIndex: barIndex,    // 演奏する順の各小節が、楽譜の何番目の小節か (アプリが小節の番号を出すのに使う)
        endBeats: scoreEndBeats,
        // 各小節の拍子 [分子, 分母] (メトロノームのビジュアライザーのドットの数)
        sigs: barIndex.map(function (i) { const mb = s.masterBars[i]; return [mb.timeSignatureNumerator, mb.timeSignatureDenominator]; }),
        tuning: trackTuning(s, currentTrack),   // 弦の音の高さ (MIDI。1弦から)。名前はアプリが付ける
        // トラックの名前と、ギターか (リード・バッキングを決めるのに使う)
        tracks: s.tracks.map(function (t) { return { name: t.name || "", guitar: isGuitar(t) }; })
      });
    });

    // 音源の準備ができた: 鳴らすトラックと音量を当てる。
    // ※ api.midiLoaded には登録しない。alphaTab 1.8.4 では、登録したときに読む値 (loadedMidiInfo) が
    //   自分自身を呼び続ける不具合があり、「Maximum call stack size exceeded」で読み込みが止まる (確かめた)。
    //   代わりに、描き終わったとき・再生を始めるときに当て直す
    api.playerReady.on(function () {
      midiReady = true;
      // 音割れを防ぐ: 全体の音量を下げておく。リード・バッキングの2トラックが重なり、
      // ミキサーで 150% まで上げても、音が割れない大きさにする
      api.masterVolume = 0.5;
      applyMidiTracks();
    });

    api.renderFinished.on(function () {
      showMessage("");
      scoreElement.appendChild(barHighlight);
      scoreElement.appendChild(cursor);
      send("rendered");
      applyMidiTracks();   // 表示するトラックを変えると MIDI が作り直されることがあるので、当て直す
    });

    api.error.on(function (e) {
      showMessage("タブ譜を読み込めませんでした");
      send("error", { message: String(e && e.message ? e.message : e) });
    });
  }

  function colourResources() {
    if (!colours) return {};
    return {
      staffLineColor: colours.line, barSeparatorColor: colours.muted, barNumberColor: colours.muted,
      mainGlyphColor: colours.text, secondaryGlyphColor: colours.muted, scoreInfoColor: colours.text
    };
  }

  // 小節を同じ幅にするか。
  //   切: alphaTab の標準 (音符の多い小節ほど広い)
  //   入: すべての小節を同じ比率 (displayScale = 1) にし、1段に並べる小節の数を固定する (UseModelLayout)
  let equalBars = false;
  function applyLayout() {
    if (!api) return;
    if (score && equalBars) {
      // 1小節 300px くらいを目安に (狭いと、音符の多い小節で数字が重なる)
      const perRow = Math.max(2, Math.min(6, Math.floor(scroller.clientWidth / 300)));
      score.defaultSystemsLayout = perRow; score.systemsLayout = [];
      for (const mb of score.masterBars) mb.displayScale = 1;
      for (const t of score.tracks) {
        t.defaultSystemsLayout = perRow; t.systemsLayout = [];
        for (const st of t.staves) for (const b of st.bars) b.displayScale = 1;
      }
    }
    // SystemsLayoutMode: 0 = Automatic (標準), 1 = UseModelLayout (小節の比率と1段の小節数を、上で決めた値にする)
    api.settings.display.systemsLayoutMode = equalBars ? 1 : 0;
    api.updateSettings();
  }

  // ページの背景・カーソルの色も、アプリのテーマに合わせる
  function applyPageColours() {
    if (!colours) return;
    document.documentElement.style.background = colours.background;
    document.body.style.background = colours.background;
    document.body.style.color = colours.text;
    document.getElementById("message").style.color = colours.muted;
    cursor.style.background = colours.accent;
    barHighlight.style.background = colours.accent;
  }

  // ---- アプリからの命令 ----
  window.scoreCommand = function (cmd) {
    switch (cmd.type) {
      case "load": load(cmd.url, cmd.track || 0); break;
      case "clear": clearScore(); break;
      case "track": showTrack(cmd.track); break;
      case "midiTracks":
        midiTracks = cmd.tracks || [];
        applyMidiTracks();
        // 鳴らすトラックが無くなった (練習画面を閉じたときなど) なら、すぐに止める
        if (api && midiReady && api.playerState === 1 && !midiTracks.some(function (t) { return !t.muted && t.volume > 0; }))
          api.pause();
        break;
      case "countdown": showCountdown(cmd.number, cmd.caption); break;
      case "freeze": scroller.classList.toggle("frozen", !!cmd.on); break;   // ラジアルメニューを出している間
      case "position": receivePosition(cmd); break;
      case "pdfBarsPerPage":
        pdfBarsPerPage = Math.max(1, cmd.bars | 0);
        setPosition(currentSeconds(performance.now()), timing.bpm, timing.offset);
        break;
      case "layout":
        equalBars = !!cmd.equalBars;
        applyLayout();
        if (api && score) api.render();
        break;
      case "colours":
        colours = cmd;
        applyPageColours();
        if (api) {
          // 色は文字列のまま settings に入れても alphaTab の色にならないので、JSON として読み込ませる
          api.settings.fillFromJson({ display: { resources: colourResources() } });
          api.updateSettings();
          if (score) api.render();
        }
        break;
    }
  };

  let currentTrack = 0;

  // ギターのトラックか: 弦が 6本以上 (7弦・8弦も)、または楽器がギター (MIDI の 24〜31)。
  // ドラム (打楽器) とベース (MIDI の 32〜39) は除く
  function isGuitar(t) {
    if (!t || !t.staves) return false;
    const program = t.playbackInfo ? t.playbackInfo.program : -1;
    if (program >= 32 && program <= 39) return false;
    for (const st of t.staves) {
      if (st.isPercussion) return false;
      const strings = st.tuning || (st.stringTuning && st.stringTuning.tunings) || [];
      if (strings.length >= 6) return true;
    }
    return program >= 24 && program <= 31;
  }

  // 表示するトラックだけを変える (ファイルは読み直さない。小節の位置は同じなので、カーソルもそのまま動く)
  function showTrack(track) {
    if (!api || !score || track < 0 || track >= score.tracks.length || track === currentTrack) return;
    currentTrack = track;
    api.renderTracks([score.tracks[track]]);
  }

  // 選んだトラックの、弦の音の高さ。ドラムなど弦のないトラックなら、弦のある最初のトラックを使う
  function trackTuning(s, track) {
    const tuningOf = function (t) {
      if (!t || !t.staves) return [];
      for (const st of t.staves) {
        const notes = st.tuning || (st.stringTuning && st.stringTuning.tunings) || [];
        if (notes.length > 0 && !st.isPercussion) return Array.from(notes);
      }
      return [];
    };
    let notes = tuningOf(s.tracks[track]);
    for (let i = 0; notes.length === 0 && i < s.tracks.length; i++) notes = tuningOf(s.tracks[i]);
    return notes;
  }

  function load(url, track) {
    currentTrack = track;
    if (api && midiReady && api.playerState === 1) api.pause();   // 前の曲の音を止める
    showMessage("タブ譜を読み込んでいます…");
    cursor.style.opacity = 0; barHighlight.style.opacity = 0;
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function (buffer) {
      const bytes = new Uint8Array(buffer);
      if (isPdf(bytes)) { loadPdf(bytes); return; }
      clearPdf();
      document.getElementById("score").style.display = "";
      if (!api) createApi();
      api.load(bytes, [track]);
    }).catch(function (e) {
      showMessage("タブ譜のファイルを開けませんでした");
      send("error", { message: String(e) });
    });
  }

  function clearScore() {
    score = null; barStartBeats = []; barIndex = []; scoreEndBeats = 0;
    scoreElement.innerHTML = "";
    if (api) { api.destroy(); api = null; }
    clearPdf();
    showMessage("");
  }

  // ---- PDF のタブ譜 (作者の指示) ----
  // PDF には「どこに何小節目があるか」の情報が無いので、小節に合わせた針・タブ譜の音 (MIDI)・小節のクリックは使わない。
  // 再生すると、画面が BPM に合わせて一定の速さで上から下へ流れる (針は出さない。作者の指示):
  //   1ページで (pdfBarsPerPage × 4) 小節 (4/4 とみなす) 進む。「×4」は、作者の指示で流れる速さを前の 1/4 にしたため。
  //   今の位置 = ページの上端 + (そのページの中の拍 ÷ 1ページの拍) × ページの高さ。この位置が画面の上から 3 割に来るように流す
  // 位置は、ほかのタブ譜と同じく、アプリの時計 (動画・音源) から届く「位置・BPM・起点」で決める。
  // ページの絵は pdf.js (Mozilla、Apache License 2.0。pdfjs/pdfjs-LICENSE.txt) で描く。
  // pdf.js は、ふつうは別のスレッド (Worker) で PDF を読むが、アプリのファイルの渡し方 (WebView のリソース) で
  // Worker が使えるか分からないので、読み込みの部品をこのページで直接読み込んで使う (globalThis.pdfjsWorker)
  const pdfElement = document.getElementById("pdf");
  const pdfSlowdown = 4;   // 流れる速さを 1/4 にする (作者の指示)
  let pdfDoc = null, pdfPages = [], pdfBarsPerPage = 24, pdfLoadCount = 0, pdfLib = null;

  function isPdf(bytes) {
    return bytes.length > 4 && bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46;   // "%PDF"
  }

  function clearPdf() {
    if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; }
    pdfPages = [];
    pdfElement.querySelectorAll("canvas").forEach(function (c) { c.remove(); });
    pdfElement.style.display = "none";
  }

  async function loadPdfLib() {
    if (pdfLib) return pdfLib;
    const worker = await import("/pdfjs/pdf.worker.min.mjs");
    globalThis.pdfjsWorker = worker;   // 読み込みの部品を、このページで直接使う (Worker を作らない)
    pdfLib = await import("/pdfjs/pdf.min.mjs");
    pdfLib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.mjs";
    return pdfLib;
  }

  async function loadPdf(bytes) {
    const count = ++pdfLoadCount;
    try {
      // 前のタブ譜 (alphaTab) を片付ける
      if (api) { if (midiReady && api.playerState === 1) api.pause(); api.destroy(); api = null; midiReady = false; }
      score = null; barStartBeats = []; barIndex = []; scoreEndBeats = 0;
      scoreElement.innerHTML = "";
      document.getElementById("score").style.display = "none";
      clearPdf();

      const lib = await loadPdfLib();
      const doc = await lib.getDocument({ data: bytes, isEvalSupported: false }).promise;
      if (count !== pdfLoadCount) { doc.destroy(); return; }   // 読み込んでいる間に、別のファイルが選ばれた
      pdfDoc = doc;
      pdfElement.style.display = "block";

      // アプリに知らせる。小節・トラックは無い (アプリは、小節の操作を秒単位にする)
      send("loaded", { title: "", artist: "", tempo: 0, bars: [], barIndex: [], endBeats: 0, sigs: [],
                       tuning: [], tracks: [], pdf: true, pages: doc.numPages });
      await renderPdfPages();
      if (count !== pdfLoadCount) return;
      showMessage("");
      send("rendered");
    } catch (e) {
      if (count !== pdfLoadCount) return;
      showMessage("PDF を開けませんでした");
      send("error", { message: String(e && e.message ? e.message : e) });
    }
  }

  // ページを、今の横幅に合わせて描く (横幅が変わったら描き直す)
  let pdfRenderedWidth = 0;
  async function renderPdfPages() {
    if (!pdfDoc) return;
    const width = Math.max(200, scroller.clientWidth - 24);
    pdfRenderedWidth = width;
    const ratio = window.devicePixelRatio || 1;
    pdfElement.querySelectorAll("canvas").forEach(function (c) { c.remove(); });
    pdfPages = [];

    for (let n = 1; n <= pdfDoc.numPages; n++) {
      const page = await pdfDoc.getPage(n);
      if (!pdfDoc || width !== pdfRenderedWidth) return;   // 描いている間に片付けた・幅が変わった
      const base = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale: width / base.width * ratio });
      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = width + "px";
      canvas.style.height = Math.floor(viewport.height / ratio) + "px";
      pdfElement.appendChild(canvas);
      pdfPages.push(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport, canvas: canvas }).promise;
    }
    setPosition(currentSeconds(performance.now()), timing.bpm, timing.offset);
  }

  let pdfResizeTimer = 0;
  window.addEventListener("resize", function () {
    if (!pdfDoc) return;
    clearTimeout(pdfResizeTimer);
    pdfResizeTimer = setTimeout(function () {
      if (Math.abs(scroller.clientWidth - 24 - pdfRenderedWidth) > 4) renderPdfPages();
    }, 250);
  });

  function setPdfPosition(seconds, bpm, offset) {
    if (!pdfDoc || pdfPages.length === 0 || bpm <= 0) return;
    const beatsPerPage = Math.max(1, pdfBarsPerPage) * 4 * pdfSlowdown;
    const beats = (seconds - offset) * bpm / 60;
    const pageFloat = Math.max(0, beats) / beatsPerPage;
    const index = Math.min(pdfPages.length - 1, Math.floor(pageFloat));
    const fraction = Math.min(1, pageFloat - index);
    const page = pdfPages[index];
    const y = page.offsetTop + fraction * page.offsetHeight;

    // 再生中は、今の位置が画面の上から 3 割のところに来るように流す (止まっているときは、作者がスクロールしたままにする)
    if (clock.playing)
      scroller.scrollTop = Math.max(0, y - scroller.clientHeight * 0.3);
  }

  // 再生位置 (秒) から、今の小節と小節の中の位置を求めて、カーソルを動かす
  // ---- タブ譜の音 (MIDI) ----
  // アプリから: 鳴らすトラック (リード・バッキング) と、その音量・ミュート。ほかのトラックは鳴らさない
  let midiTracks = [];
  let midiReady = false;

  // 演奏する順の小節を求める。alphaTab が MIDI を作るときと同じ方法 (MidiFileGenerator) で作り、
  // その「小節の表」(tickLookup) を読む。繰り返し・1番かっこ 2番かっこ・弱起の小節も、鳴る音とぴったり合う。
  // 位置は MIDI の単位 (4分音符 = 960) なので、960 で割って拍にする。うまくいかなければ、楽譜の順に並べる
  function computePlayOrder(s) {
    barStartBeats = []; barIndex = []; scoreEndBeats = 0;
    try {
      const midiFile = new alphaTab.midi.MidiFile();
      const generator = new alphaTab.midi.MidiFileGenerator(s, api.settings, new alphaTab.midi.AlphaSynthMidiFileHandler(midiFile));
      generator.generate();
      for (const m of generator.tickLookup.masterBars) {
        barStartBeats.push(m.start / 960);
        barIndex.push(m.masterBar.index);
        scoreEndBeats = Math.max(scoreEndBeats, m.end / 960);
      }
    } catch (e) {
      barStartBeats = []; barIndex = [];
    }
    if (barStartBeats.length > 0) return;

    let beats = 0;
    s.masterBars.forEach(function (mb, i) {
      barStartBeats.push(beats);
      barIndex.push(i);
      beats += mb.timeSignatureNumerator * 4 / mb.timeSignatureDenominator;
    });
    scoreEndBeats = beats;
  }

  // 当て直しの途中で、alphaTab が MIDI の知らせ (midiLoaded) を出すことがある。その中でまた当て直すと終わらないので、入れ子にしない
  let applyingMidi = false;
  function applyMidiTracks() {
    if (!api || !score || !midiReady || applyingMidi) return;
    applyingMidi = true;
    try {
      const listed = {};
      for (const t of midiTracks) listed[t.index] = t;
      for (let i = 0; i < score.tracks.length; i++) {
        const t = listed[i];
        api.changeTrackMute([score.tracks[i]], !t || t.muted);
        if (t) api.changeTrackVolume([score.tracks[i]], t.volume);
      }
    } finally {
      applyingMidi = false;
    }
  }

  // アプリの再生に合わせて鳴らす。位置は拍で合わせる (アプリの BPM とずらしで、カーソルと同じ計算)。
  // 速さは「アプリの速度 × アプリの BPM ÷ タブ譜のテンポ」。
  //
  // 【ガタガタ・音割れの原因だったこと】alphaTab は、再生の速さ (playbackSpeed) を変えるたびに、
  // 中でその位置へ移動し直し、作ってあった音を捨てる (AlphaSynth.updatePlaybackSpeed → timePosition → seek)。
  // 前は、ずれを直すために速さを 0.1 秒ごとに少しずつ変えていたので、そのたびに音が途切れていた。
  // 今は:
  //   - 速さを変えるのは、アプリの速度・BPM が変わったときだけ
  //   - ずれは、届くたびの値をならして (ばらつきを消して) 見る。大きくずれたときだけ位置を合わせ直す
  //   - 合わせ直したあと 2 秒は、合わせ直さない (alphaTab の位置の知らせが追いつくのを待つ)
  const midiJumpSeconds = 0.12, midiJumpCooldownMs = 2000;
  let midiDrift = 0, midiLastJumpAt = 0, midiSpeed = 0;

  function setMidiSpeed(speed) {
    if (Math.abs(midiSpeed - speed) < 0.0005) return;
    midiSpeed = speed;
    api.playbackSpeed = speed;
  }

  function jumpMidi(tick) {
    api.tickPosition = tick;
    midiDrift = 0;
    midiLastJumpAt = performance.now();
  }

  function syncMidi(seconds, bpm, offset, rate, playing) {
    if (!api || !score || !midiReady || !api.isReadyForPlayback) return;

    const beats = (seconds - offset) * bpm / 60;
    const anyTrack = midiTracks.some(function (t) { return !t.muted && t.volume > 0; });
    const playingNow = api.playerState === 1;   // alphaTab の PlayerState.Playing

    if (!playing || !anyTrack || beats < 0 || bpm <= 0) {
      if (playingNow) api.pause();
      return;
    }

    const scoreTempo = score.tempo > 0 ? score.tempo : bpm;
    const speed = Math.max(0.1, rate * bpm / scoreTempo);
    const tick = beats * 960;   // MIDI の位置 (4分音符 = 960)

    if (!playingNow) {
      applyMidiTracks();   // 鳴らす前に、トラックのミュート・音量を確かめる
      midiSpeed = 0;       // 止まっている間に alphaTab の側で変わっていてもよいように、必ず設定し直す
      setMidiSpeed(speed);
      jumpMidi(tick);
      api.play();
      return;
    }

    // 速度・BPM が変わったとき (変わったときだけ。上の【原因】を参照)
    if (Math.abs(midiSpeed - speed) >= 0.0005) {
      setMidiSpeed(speed);
      jumpMidi(tick);
      return;
    }

    // ずれ (秒)。プラス = MIDI が先に進んでいる。alphaTab の位置の知らせは飛び飛びなので、ならして見る
    const drift = (api.tickPosition - tick) / 960 * 60 / bpm;
    midiDrift = midiDrift * 0.7 + drift * 0.3;

    const now = performance.now();
    if (Math.abs(drift) > 1.0 || (Math.abs(midiDrift) > midiJumpSeconds && now - midiLastJumpAt > midiJumpCooldownMs))
      jumpMidi(tick);   // 移動・ループで戻ったとき (大きくずれた) は、すぐに合わせる
  }

  // ---- 再生位置 ----
  // アプリからの位置の報告は、届く間隔がばらつく (1秒に約10回)。届いたときに針を置くだけだと、ガタガタ進む。
  // そこで、報告の間はこのページで「最後の位置 + 経過時間 × 速度」で針を進め、画面の更新 (requestAnimationFrame) ごとに描く。
  // 報告とのずれが小さいときは少しずつ寄せ、大きいとき (移動したとき) はすぐに合わせる
  let clock = { seconds: 0, at: 0, rate: 1, playing: false };
  let timing = { bpm: 120, offset: 0 };
  let animating = false;

  function currentSeconds(now) {
    return clock.playing ? clock.seconds + (now - clock.at) / 1000 * clock.rate : clock.seconds;
  }

  function receivePosition(cmd) {
    const now = performance.now();
    const predicted = currentSeconds(now);
    const playing = !!cmd.playing, rate = cmd.rate > 0 ? cmd.rate : 1;

    if (playing && clock.playing && Math.abs(cmd.seconds - predicted) < 0.25)
      clock = { seconds: predicted + (cmd.seconds - predicted) * 0.15, at: now, rate: rate, playing: true };
    else
      clock = { seconds: cmd.seconds, at: now, rate: rate, playing: playing };

    timing = { bpm: cmd.bpm, offset: cmd.offset };
    setPosition(clock.seconds, timing.bpm, timing.offset);
    syncMidi(clock.seconds, cmd.bpm, cmd.offset, rate, playing);   // なめらかにした位置で合わせる

    if (playing && !animating) {
      animating = true;
      requestAnimationFrame(animate);
    }
  }

  function animate() {
    if (!clock.playing) { animating = false; return; }
    setPosition(currentSeconds(performance.now()), timing.bpm, timing.offset);
    requestAnimationFrame(animate);
  }

  let scrolledToLine = -1;

  function setPosition(seconds, bpm, offset) {
    if (pdfDoc) { setPdfPosition(seconds, bpm, offset); return; }
    if (!api || !score || !api.renderer || !api.renderer.boundsLookup || barStartBeats.length === 0) return;

    const beats = Math.max(0, (seconds - offset) * bpm / 60);
    let index = 0;
    while (index + 1 < barStartBeats.length && barStartBeats[index + 1] <= beats) index++;

    const barEnd = index + 1 < barStartBeats.length ? barStartBeats[index + 1] : Math.max(scoreEndBeats, barStartBeats[index] + 1);
    const barLength = Math.max(0.001, barEnd - barStartBeats[index]);
    const fraction = Math.min(1, Math.max(0, (beats - barStartBeats[index]) / barLength));

    // 針は、演奏する順の小節ではなく、楽譜の上のその小節に置く (繰り返しの2回目は、同じ小節にもう一度戻る)
    const bounds = api.renderer.boundsLookup.findMasterBarByIndex(barIndex[index]);
    if (!bounds) return;

    const v = bounds.visualBounds, line = bounds.lineAlignedBounds || bounds.realBounds;
    cursor.style.left = (v.x + v.w * fraction) + "px";
    cursor.style.top = line.y + "px";
    cursor.style.height = line.h + "px";
    cursor.style.opacity = 1;

    barHighlight.style.left = v.x + "px"; barHighlight.style.top = line.y + "px";
    barHighlight.style.width = v.w + "px"; barHighlight.style.height = line.h + "px";
    barHighlight.style.opacity = 0.08;

    // カーソルの行が見えなくなりそうなら、自動でスクロールする (同じ行では1回だけ。毎フレーム頼むと動きが止まるため)
    const top = line.y, bottom = line.y + line.h;
    if (top !== scrolledToLine && (top < scroller.scrollTop + 20 || bottom > scroller.scrollTop + scroller.clientHeight - 20)) {
      scrolledToLine = top;
      scroller.scrollTo({ top: Math.max(0, top - 40), behavior: "smooth" });
    }
  }

  // ラジアルメニュー (アプリ側): マウスの左右を同時に押し続けると開く。その操作のあとで、
  // 離したときの「クリック」(小節から再生) や、右クリックのメニューが動かないようにする
  let twoButtons = false;
  document.addEventListener("mousedown", function (e) {
    if ((e.buttons & 3) === 3) { twoButtons = true; e.preventDefault(); }
  }, true);
  document.addEventListener("dragstart", function (e) { e.preventDefault(); }, true);
  document.addEventListener("mouseup", function (e) {
    if (twoButtons && (e.buttons & 3) === 0) setTimeout(function () { twoButtons = false; }, 0);   // click の後で戻す
  }, true);
  document.addEventListener("contextmenu", function (e) { if (twoButtons || (e.buttons & 1)) e.preventDefault(); }, true);
  // 真ん中のボタンでもラジアルメニューを開く。押したときの自動スクロール (丸い印が出るもの) を止める
  document.addEventListener("mousedown", function (e) { if (e.button === 1) e.preventDefault(); }, true);
  document.addEventListener("auxclick", function (e) { if (e.button === 1) e.preventDefault(); }, true);

  // 小節をクリックしたら、その小節の頭から再生できるように、アプリに知らせる
  scoreElement.addEventListener("click", function (e) {
    if (twoButtons) return;   // ラジアルメニューの操作だった
    if (!api || !score || !api.renderer || !api.renderer.boundsLookup || barStartBeats.length === 0) return;
    const rect = scoreElement.getBoundingClientRect();
    const beat = api.renderer.boundsLookup.getBeatAtPos(e.clientX - rect.left, e.clientY - rect.top);
    if (!beat || !beat.voice || !beat.voice.bar || !beat.voice.bar.masterBar) return;
    // 繰り返しのある曲では、同じ小節を何度も弾く。今の位置にいちばん近い回を選ぶ
    // (2回目を弾いているときにクリックしたら、2回目のその小節へ)
    const clicked = beat.voice.bar.masterBar.index;
    const nowBeats = Math.max(0, (currentSeconds(performance.now()) - timing.offset) * timing.bpm / 60);
    let best = -1;
    for (let i = 0; i < barIndex.length; i++)
      if (barIndex[i] === clicked && (best < 0 || Math.abs(barStartBeats[i] - nowBeats) < Math.abs(barStartBeats[best] - nowBeats)))
        best = i;
    if (best >= 0)
      send("barClicked", { bar: best, beats: barStartBeats[best] });
  });

  // 再生の操作キーは、タブ譜の上で押してもアプリに渡す (WebView がキーを受け取ってしまうため)
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Enter" || e.code === "Home") {
      e.preventDefault();   // スペースでページがスクロールしないように
      send("key", { key: e.code });
    }
  });

  document.addEventListener("DOMContentLoaded", function () { showMessage(""); send("pageReady"); });
</script>
</body>
</html>
