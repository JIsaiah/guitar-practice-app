<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- タブ譜の表示 (設計書 #5、PoC-3)。alphaTab (MPL-2.0) で描く。ファイルはすべてアプリに同梱し、ネットから読まない -->
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--color-surface); color: var(--color-text);
               font-family: var(--font-ui); font-size: var(--font-size-body); }
  /* タブ譜の上で、ドラッグで文字が選ばれて (青く反転して) ハイライトされたり、それで画面がスクロールしたりしないように */
  html, body, #scroller, #score { user-select: none; -webkit-user-select: none; }
  #scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
  /* ラジアルメニュー (アプリ側) を出している間: マウスではスクロールさせず、タブ譜にマウスの操作を渡さない */
  #scroller.frozen { overflow-y: hidden; }
  /* スクロールバー: 細く、目立たない形 (作者の指示)。溝は透明で、つまみだけを丸く出す。上下の矢印は出さない。
     つまみは薄い色 (75%)。ふだんは隠し、ホイールを回したとき・スクロールバーの近くでマウスを動かしたときだけ出して、
     2 秒動かさなければ消す (下のスクリプトが scrolling を付け外しする) */
  /* スクロールバーの場所は、いつも太いときの幅 (14px) を取っておく (作者の指示: 太くなるときにタブ譜が左にずれないように)。
     ふだんは、つまみの左 8px を透明な枠にして、右の 6px だけを塗る (background-clip)。
     スクロールバーの上にマウスを乗せると、透明な枠をなくして 14px いっぱいに塗る (作者の指示: 引っ張りやすく) */
  #scroller::-webkit-scrollbar { width: 14px; }
  #scroller::-webkit-scrollbar-track { background: transparent; }
  #scroller::-webkit-scrollbar-thumb { background: transparent; background-clip: padding-box;
                                       border: 0 solid transparent; border-left-width: 8px;
                                       border-radius: 11px 3px 3px 11px / 3px; }
  #scroller.wide::-webkit-scrollbar-thumb { border-left-width: 0; border-radius: 7px; }
  #scroller.scrolling::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-border) 75%, transparent); }
  #scroller.scrolling::-webkit-scrollbar-thumb:hover,
  #scroller.scrolling::-webkit-scrollbar-thumb:active { background: color-mix(in srgb, var(--color-text-muted) 75%, transparent); }
  #scroller::-webkit-scrollbar-button { display: none; height: 0; }
  #scroller.frozen #score { pointer-events: none; }
  #score { position: relative; }
  /* PDF のタブ譜 (作者の指示)。ページを横幅いっぱいの画像にして縦に並べ、再生中は画面を上から下へ流す (針は出さない) */
  #pdf { position: relative; display: none; padding: 8px 0 40vh; }
  #pdf canvas { display: block; margin: 0 auto 12px; background: #fff; box-shadow: 0 0 0 1px var(--color-border); }
  /* PDF の繰り返しの印 (作者が右クリックで置く)。始め・終わりの横線と、回数の札 */
  .pdfRepeat { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--color-accent);
               pointer-events: none; z-index: 5; }
  .pdfRepeat span { position: absolute; right: 16px; top: -24px; padding: 2px 8px; border-radius: 4px;
                    background: var(--color-accent); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pdfRepeat.pending { opacity: 0.6; }
  #cursor { position: absolute; width: 3px; border-radius: 2px; background: var(--color-accent);
            opacity: 0; transition: opacity 0.15s; pointer-events: none; z-index: 5; }
  #barHighlight { position: absolute; background: var(--color-accent); opacity: 0; pointer-events: none; z-index: 4; }
  /* タブ譜の編集 (作者の指示): 編集中の音の枠と、上の案内 */
  #editBox { position: absolute; display: none; border: 2px solid var(--color-accent); border-radius: 5px;
             box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 25%, transparent);
             pointer-events: none; z-index: 6; box-sizing: border-box; }
  #editHint { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: none; z-index: 50;
              padding: 4px 12px; border-radius: 6px; background: var(--color-accent); color: #fff;
              font-size: 12px; font-weight: 700; white-space: nowrap; pointer-events: none; }
  #message { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             color: var(--color-text-muted); text-align: center; padding: 24px; box-sizing: border-box; }
  /* 再生前のカウントダウン (setlist-mode.md 7.2)。離れた位置からでも読める大きさ。
     すぐに始めるのはアプリの再生ボタンの2回押し。クリックは受けない (下のタブ譜をそのまま触れる) */
  #countdown { position: absolute; inset: 0; z-index: 100; display: none; flex-direction: column;
               align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45);
               pointer-events: none; user-select: none; }
  #countdown .number { font-size: min(55vh, 280px); font-weight: 700; line-height: 1; color: #fff;
                       font-family: var(--font-numeric), var(--font-ui); text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); }
  #countdown .caption { margin-top: 16px; font-size: 26px; font-weight: 700; color: #fff; text-align: center;
                        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
  #countdown .hint { margin-top: 8px; font-size: 15px; color: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
<div id="message">タブ譜を準備しています…</div>
<div id="scroller"><div id="score"></div><div id="pdf"></div></div>
<div id="countdown"><div class="number"></div><div class="caption"></div><div class="hint">▶ をもう一度押すと、すぐに始めます</div></div>
<script src="alphatab/alphaTab.min.js"></script>
<script>
  function send(type, data) {
    if (window.__JUCE__ && window.__JUCE__.backend)
      window.__JUCE__.backend.emitEvent("score", Object.assign({ type: type }, data || {}));
  }
  // 再生前のカウントダウン。number が 0 で caption だけなら「読み込み中…」などの文字だけ、両方なければ消す
  function showCountdown(number, caption) {
    const c = document.getElementById("countdown");
    c.querySelector(".number").textContent = number > 0 ? number : "";
    c.querySelector(".number").style.display = number > 0 ? "" : "none";
    c.querySelector(".hint").style.display = number > 0 ? "" : "none";
    c.querySelector(".caption").textContent = caption || "";
    c.style.display = number > 0 || caption ? "flex" : "none";
  }

  function showMessage(text) {
    const m = document.getElementById("message");
    m.textContent = text;
    m.style.display = text ? "flex" : "none";
  }

  const scroller = document.getElementById("scroller");

  // スクロールバーを出すのは、使う人が動かしたときだけ (再生中の自動スクロールでは出さない)。2 秒動かさなければ消す
  let scrollbarTimer = 0;
  // Chromium は、クラスを変えただけではスクロールバーを描き直さないことがあるので、同じ瞬間に作り直させる
  // (スクロールの位置は変わらない。画面にも出ない)
  function setScrollbarShown(shown) {
    if (scroller.classList.contains("scrolling") === shown) return;
    scroller.classList.toggle("scrolling", shown);
    scroller.style.overflowY = "hidden";
    void scroller.offsetWidth;
    scroller.style.overflowY = "";
  }
  function showScrollbar() {
    setScrollbarShown(true);
    clearTimeout(scrollbarTimer);
    scrollbarTimer = setTimeout(function () { setScrollbarShown(false); }, 2000);
  }
  function nearScrollbar(e) { return e.clientX >= scroller.getBoundingClientRect().right - 16; }
  // マウスがスクロールバーの上にある間 (つまんで動かしている間も) は太くする
  let draggingScrollbar = false;
  function setScrollbarWide(wide) {
    if (scroller.classList.contains("wide") === wide) return;
    scroller.classList.toggle("wide", wide);
    scroller.style.overflowY = "hidden";   // 描き直させる (setScrollbarShown と同じ)
    void scroller.offsetWidth;
    scroller.style.overflowY = "";
  }
  scroller.addEventListener("wheel", showScrollbar, { passive: true });
  scroller.addEventListener("pointermove", function (e) {
    if (nearScrollbar(e) || e.buttons) showScrollbar();
    setScrollbarWide(draggingScrollbar || (nearScrollbar(e) && scroller.scrollHeight > scroller.clientHeight));
  });
  scroller.addEventListener("pointerdown", function (e) {
    if (nearScrollbar(e)) { showScrollbar(); draggingScrollbar = true; setScrollbarWide(true); }
  });
  document.addEventListener("pointerup", function () { draggingScrollbar = false; }, true);
  scroller.addEventListener("pointerleave", function () { if (!draggingScrollbar) setScrollbarWide(false); });
  const scoreElement = document.getElementById("score");
  const cursor = document.createElement("div"); cursor.id = "cursor";
  const barHighlight = document.createElement("div"); barHighlight.id = "barHighlight";

  let api = null, score = null, colours = null;
  // 小節は「演奏する順」に並べる (繰り返し記号・1番かっこ 2番かっこを展開したもの)。
  // タブ譜の音 (MIDI) は alphaTab がこの順で鳴らすので、針・小節のクリック・アプリのループもこの順で数える
  let barStartBeats = [];   // 演奏する順の小節の始まりの拍 (4分音符の数)
  let barIndex = [];        // 演奏する順の小節が、楽譜の何番目の小節か (0 から。針を置く場所)
  let scoreEndBeats = 0;    // 曲の終わりの拍

  function createApi() {
    api = new alphaTab.AlphaTabApi(scoreElement, {
      // includeNoteBounds: 音の1つ1つの場所を覚えておく (タブ譜の編集で、押した音を探す・枠を置くのに使う)
      core: { fontDirectory: "/alphatab/font/", useWorkers: false, includeNoteBounds: true },
      // タブ譜の音 (MIDI)。alphaTab の音源 (SONiVOX の SoundFont、同梱) で鳴らす。
      // 再生の位置・止める・始めるは、アプリの時計に合わせてこのページが行う (syncMidi)。alphaTab のカーソルは使わない
      player: { playerMode: alphaTab.PlayerMode.EnabledSynthesizer, soundFont: "/alphatab/soundfont/sonivox.sf2",
                enableCursor: false, enableAnimatedBeatCursor: false, enableUserInteraction: false },
      display: { staveProfile: "tab", scale: 1.0, resources: colourResources() }
    });

    api.scoreLoaded.on(function (s) {
      score = s;
      // タブ譜の音を、エレキギター (MIDI の 29 番: オーバードライブ・ギター) にする。
      // タブ譜のファイルによっては、アコースティックギターやナイロン弦になっていて、エレキらしく聞こえないため。
      // alphaTab は、この知らせのあとで MIDI を作るので、ここで変えれば効く
      for (const t of s.tracks)
        if (isGuitar(t) && t.playbackInfo) t.playbackInfo.program = 29;
      applyLayout();   // 描く前に、小節の幅の決め方を設定する
      // 演奏する順の小節と、それぞれが何拍目から始まるかを求めておく (テンポは一定とみなす。設計書 3.1 の「一定テンポ」)
      computePlayOrder(s);
      send("loaded", {
        title: s.title || "", artist: s.artist || "", tempo: s.tempo || 0,
        bars: barStartBeats,   // 演奏する順の各小節が、曲の頭から何拍目で始まるか (アプリがループを小節の頭に合わせるのに使う)
        barIndex: barIndex,    // 演奏する順の各小節が、楽譜の何番目の小節か (アプリが小節の番号を出すのに使う)
        endBeats: scoreEndBeats,
        // 各小節の拍子 [分子, 分母] (メトロノームのビジュアライザーのドットの数)
        sigs: barIndex.map(function (i) { const mb = s.masterBars[i]; return [mb.timeSignatureNumerator, mb.timeSignatureDenominator]; }),
        tuning: trackTuning(s, currentTrack),   // 弦の音の高さ (MIDI。1弦から)。名前はアプリが付ける
        // トラックの名前と、ギターか (リード・バッキングを決めるのに使う)
        tracks: s.tracks.map(function (t) { return { name: t.name || "", guitar: isGuitar(t) }; })
      });
    });

    // 音源の準備ができた: 鳴らすトラックと音量を当てる。
    // ※ api.midiLoaded には登録しない。alphaTab 1.8.4 では、登録したときに読む値 (loadedMidiInfo) が
    //   自分自身を呼び続ける不具合があり、「Maximum call stack size exceeded」で読み込みが止まる (確かめた)。
    //   代わりに、描き終わったとき・再生を始めるときに当て直す
    api.playerReady.on(function () {
      midiReady = true;
      // 音割れを防ぐ: 全体の音量を下げておく。リード・バッキングの2トラックが重なり、
      // ミキサーで 150% まで上げても、音が割れない大きさにする
      api.masterVolume = 0.5;
      applyMidiTracks();
    });

    api.renderFinished.on(function () {
      showMessage("");
      scoreElement.appendChild(barHighlight);
      scoreElement.appendChild(cursor);
      if (keepAfterLoad) restoreAfterReload();   // 挿入のあとの読み直し: 前のスクロール・選んでいた場所に戻す
      placeEditBox(false);   // 編集中の音の枠を、描き直した場所に置き直す
      send("rendered");
      applyMidiTracks();   // 表示するトラックを変えると MIDI が作り直されることがあるので、当て直す
    });

    api.error.on(function (e) {
      showMessage("タブ譜を読み込めませんでした");
      send("error", { message: String(e && e.message ? e.message : e) });
    });
  }

  function colourResources() {
    if (!colours) return {};
    return {
      staffLineColor: colours.line, barSeparatorColor: colours.muted, barNumberColor: colours.muted,
      mainGlyphColor: colours.text, secondaryGlyphColor: colours.muted, scoreInfoColor: colours.text
    };
  }

  // 小節を同じ幅にするか。
  //   切: alphaTab の標準 (音符の多い小節ほど広い)
  //   入: すべての小節を同じ比率 (displayScale = 1) にし、1段に並べる小節の数を固定する (UseModelLayout)
  let equalBars = false;
  function applyLayout() {
    if (!api) return;
    if (score && equalBars) {
      // 1小節 300px くらいを目安に (狭いと、音符の多い小節で数字が重なる)
      const perRow = Math.max(2, Math.min(6, Math.floor(scroller.clientWidth / 300)));
      score.defaultSystemsLayout = perRow; score.systemsLayout = [];
      for (const mb of score.masterBars) mb.displayScale = 1;
      for (const t of score.tracks) {
        t.defaultSystemsLayout = perRow; t.systemsLayout = [];
        for (const st of t.staves) for (const b of st.bars) b.displayScale = 1;
      }
    }
    // SystemsLayoutMode: 0 = Automatic (標準), 1 = UseModelLayout (小節の比率と1段の小節数を、上で決めた値にする)
    api.settings.display.systemsLayoutMode = equalBars ? 1 : 0;
    api.updateSettings();
  }

  // ページの背景・カーソルの色も、アプリのテーマに合わせる
  function applyPageColours() {
    if (!colours) return;
    document.documentElement.style.background = colours.background;
    document.body.style.background = colours.background;
    document.body.style.color = colours.text;
    document.getElementById("message").style.color = colours.muted;
    cursor.style.background = colours.accent;
    barHighlight.style.background = colours.accent;
    editBox.style.borderColor = colours.accent;
    editHint.style.background = colours.accent;
  }

  // ---- アプリからの命令 ----
  window.scoreCommand = function (cmd) {
    switch (cmd.type) {
      case "load":
        // keep: 拍・小節の挿入を見せるための読み直し。スクロールの位置を保ち、描き終えたら keep の場所を選び直す
        // (編集モードは続ける。アプリには「終わった」と知らせない)
        if (cmd.keep && typeof cmd.keep === "object") {
          keepAfterLoad = { scroll: scroller.scrollTop, place: cmd.keep, editing: !!editSel };
          editSel = null; fretBuffer = ""; editBox.style.display = "none";
        } else {
          keepAfterLoad = null;
          endEdit();
        }
        undoStack = []; redoStack = []; editable = !!cmd.editable; load(cmd.url, cmd.track || 0);
        break;
      case "clear": endEdit(); undoStack = []; redoStack = []; editable = false; clearScore(); break;
      case "undo": if (editable && score) undoEdit(); break;
      case "redo": if (editable && score) redoEdit(); break;
      case "track": endEdit(); showTrack(cmd.track); break;
      case "endEdit": endEdit(); break;
      case "midiTracks":
        midiTracks = cmd.tracks || [];
        applyMidiTracks();
        // 鳴らすトラックが無くなった (練習画面を閉じたときなど) なら、すぐに止める
        if (api && midiReady && api.playerState === 1 && !midiTracks.some(function (t) { return !t.muted && t.volume > 0; }))
          api.pause();
        break;
      case "countdown": showCountdown(cmd.number, cmd.caption); break;
      case "freeze": scroller.classList.toggle("frozen", !!cmd.on); break;   // ラジアルメニューを出している間
      case "position": receivePosition(cmd); break;
      case "pdfSpeed":
        pdfSpeed = Math.max(0.01, (cmd.percent | 0) / 100);
        setPosition(currentSeconds(performance.now()), timing.bpm, timing.offset);
        break;
      case "pdfRepeats":
        pdfRepeats = (cmd.repeats || []).map(function (r) { return { start: +r.start, end: +r.end, count: Math.max(2, r.count | 0) }; })
                                       .filter(function (r) { return r.end > r.start; })
                                       .sort(function (a, b) { return a.start - b.start; });
        pdfPendingStart = typeof cmd.pending === "number" && cmd.pending >= 0 ? cmd.pending : -1;
        drawPdfRepeats();
        setPosition(currentSeconds(performance.now()), timing.bpm, timing.offset);
        break;
      case "layout":
        equalBars = !!cmd.equalBars;
        applyLayout();
        if (api && score) api.render();
        break;
      case "colours":
        colours = cmd;
        applyPageColours();
        if (api) {
          // 色は文字列のまま settings に入れても alphaTab の色にならないので、JSON として読み込ませる
          api.settings.fillFromJson({ display: { resources: colourResources() } });
          api.updateSettings();
          if (score) api.render();
        }
        break;
    }
  };

  let currentTrack = 0;

  // ギターのトラックか: 弦が 6本以上 (7弦・8弦も)、または楽器がギター (MIDI の 24〜31)。
  // ドラム (打楽器) とベース (MIDI の 32〜39) は除く
  function isGuitar(t) {
    if (!t || !t.staves) return false;
    const program = t.playbackInfo ? t.playbackInfo.program : -1;
    if (program >= 32 && program <= 39) return false;
    for (const st of t.staves) {
      if (st.isPercussion) return false;
      const strings = st.tuning || (st.stringTuning && st.stringTuning.tunings) || [];
      if (strings.length >= 6) return true;
    }
    return program >= 24 && program <= 31;
  }

  // 表示するトラックだけを変える (ファイルは読み直さない。小節の位置は同じなので、カーソルもそのまま動く)
  function showTrack(track) {
    if (!api || !score || track < 0 || track >= score.tracks.length || track === currentTrack) return;
    currentTrack = track;
    api.renderTracks([score.tracks[track]]);
  }

  // 選んだトラックの、弦の音の高さ。ドラムなど弦のないトラックなら、弦のある最初のトラックを使う
  function trackTuning(s, track) {
    const tuningOf = function (t) {
      if (!t || !t.staves) return [];
      for (const st of t.staves) {
        const notes = st.tuning || (st.stringTuning && st.stringTuning.tunings) || [];
        if (notes.length > 0 && !st.isPercussion) return Array.from(notes);
      }
      return [];
    };
    let notes = tuningOf(s.tracks[track]);
    for (let i = 0; notes.length === 0 && i < s.tracks.length; i++) notes = tuningOf(s.tracks[i]);
    return notes;
  }

  function load(url, track) {
    currentTrack = track;
    if (api && midiReady && api.playerState === 1) api.pause();   // 前の曲の音を止める
    showMessage("タブ譜を読み込んでいます…");
    cursor.style.opacity = 0; barHighlight.style.opacity = 0;
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function (buffer) {
      const bytes = new Uint8Array(buffer);
      if (isPdf(bytes)) { loadPdf(bytes); return; }
      clearPdf();
      document.getElementById("score").style.display = "";
      if (!api) createApi();
      api.load(bytes, [track]);
    }).catch(function (e) {
      showMessage("タブ譜のファイルを開けませんでした");
      send("error", { message: String(e) });
    });
  }

  function clearScore() {
    score = null; barStartBeats = []; barIndex = []; scoreEndBeats = 0;
    scoreElement.innerHTML = "";
    if (api) { api.destroy(); api = null; }
    clearPdf();
    showMessage("");
  }

  // ---- PDF のタブ譜 (作者の指示) ----
  // PDF には「どこに何小節目があるか」の情報が無いので、小節に合わせた針・タブ譜の音 (MIDI)・小節のクリックは使わない。
  // 再生すると、画面が BPM に合わせて一定の速さで上から下へ流れる (針は出さない。作者の指示)。
  //   速さは「画面の高さ」で測る (作者の指示): 100% で画面1つ分を 12 小節 (4/4 とみなす) で流す。
  //   速さはアプリの「速さ ○ %」(pdfSpeed。1 = 100%) で変える (作者の指示: 小節の数より % のほうが想像しやすい)。
  //   ページの数・大きさには関係しないので、縦に長い1枚の PDF でも同じように流れる。
  //   画面の上から 3 割のところを「読んでいる線」(見えない) とし、この線が PDF の上を進む。
  //   作者が置いた繰り返し (pdfRepeats) の終わりに線が来たら、始めへ戻り、決めた回数だけ繰り返す
  // 位置は、ほかのタブ譜と同じく、アプリの時計 (動画・音源) から届く「位置・BPM・起点」で決める。
  // ページの絵は pdf.js (Mozilla、Apache License 2.0。pdfjs/pdfjs-LICENSE.txt) で描く。
  // pdf.js は、ふつうは別のスレッド (Worker) で PDF を読むが、アプリのファイルの渡し方 (WebView のリソース) で
  // Worker が使えるか分からないので、読み込みの部品をこのページで直接読み込んで使う (globalThis.pdfjsWorker)
  const pdfElement = document.getElementById("pdf");
  const pdfBarsPerScreenAt100 = 12;
  let pdfDoc = null, pdfPages = [], pdfSpeed = 1, pdfLoadCount = 0, pdfLib = null;
  // 繰り返し: 位置は「ページの番号 (0 から) + ページの中の割合 (0〜1)」で持つ (ウィンドウの幅が変わっても同じ場所)。
  // count は弾く回数 (2 = 2回弾く = 1回戻る)。pdfPendingStart は「ここから繰り返し」だけ置いた始め (-1 = なし)
  let pdfRepeats = [], pdfPendingStart = -1;
  const pdfReadingLine = 0.3;   // 読んでいる線: 画面の上から 3 割

  function isPdf(bytes) {
    return bytes.length > 4 && bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46;   // "%PDF"
  }

  function clearPdf() {
    if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; }
    pdfPages = [];
    pdfElement.querySelectorAll("canvas, .pdfRepeat").forEach(function (c) { c.remove(); });
    pdfElement.style.display = "none";
  }

  async function loadPdfLib() {
    if (pdfLib) return pdfLib;
    const worker = await import("/pdfjs/pdf.worker.min.mjs");
    globalThis.pdfjsWorker = worker;   // 読み込みの部品を、このページで直接使う (Worker を作らない)
    pdfLib = await import("/pdfjs/pdf.min.mjs");
    pdfLib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.mjs";
    return pdfLib;
  }

  async function loadPdf(bytes) {
    const count = ++pdfLoadCount;
    try {
      // 前のタブ譜 (alphaTab) を片付ける
      if (api) { if (midiReady && api.playerState === 1) api.pause(); api.destroy(); api = null; midiReady = false; }
      score = null; barStartBeats = []; barIndex = []; scoreEndBeats = 0;
      scoreElement.innerHTML = "";
      document.getElementById("score").style.display = "none";
      clearPdf();

      const lib = await loadPdfLib();
      const doc = await lib.getDocument({ data: bytes, isEvalSupported: false }).promise;
      if (count !== pdfLoadCount) { doc.destroy(); return; }   // 読み込んでいる間に、別のファイルが選ばれた
      pdfDoc = doc;
      pdfElement.style.display = "block";

      // アプリに知らせる。小節・トラックは無い (アプリは、小節の操作を秒単位にする)
      send("loaded", { title: "", artist: "", tempo: 0, bars: [], barIndex: [], endBeats: 0, sigs: [],
                       tuning: [], tracks: [], pdf: true, pages: doc.numPages });
      await renderPdfPages();
      if (count !== pdfLoadCount) return;
      showMessage("");
      send("rendered");
    } catch (e) {
      if (count !== pdfLoadCount) return;
      showMessage("PDF を開けませんでした");
      send("error", { message: String(e && e.message ? e.message : e) });
    }
  }

  // ページを、今の横幅に合わせて描く (横幅が変わったら描き直す)
  let pdfRenderedWidth = 0;
  async function renderPdfPages() {
    if (!pdfDoc) return;
    const width = Math.max(200, scroller.clientWidth - 24);
    pdfRenderedWidth = width;
    const ratio = window.devicePixelRatio || 1;
    pdfElement.querySelectorAll("canvas").forEach(function (c) { c.remove(); });
    pdfPages = [];

    for (let n = 1; n <= pdfDoc.numPages; n++) {
      const page = await pdfDoc.getPage(n);
      if (!pdfDoc || width !== pdfRenderedWidth) return;   // 描いている間に片付けた・幅が変わった
      const base = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale: width / base.width * ratio });
      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = width + "px";
      canvas.style.height = Math.floor(viewport.height / ratio) + "px";
      pdfElement.appendChild(canvas);
      pdfPages.push(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport, canvas: canvas }).promise;
      drawPdfRepeats();
    }
    setPosition(currentSeconds(performance.now()), timing.bpm, timing.offset);
  }

  // 「ページ + 割合」と、PDF の中の高さ (px) の変換
  function pdfPosToY(pos) {
    if (pdfPages.length === 0) return 0;
    const index = Math.max(0, Math.min(pdfPages.length - 1, Math.floor(pos)));
    const page = pdfPages[index];
    return page.offsetTop + Math.max(0, Math.min(1, pos - index)) * page.offsetHeight;
  }
  function pdfYToPos(y) {
    for (let i = 0; i < pdfPages.length; i++) {
      const page = pdfPages[i];
      if (y < page.offsetTop + page.offsetHeight || i === pdfPages.length - 1)
        return i + Math.max(0, Math.min(1, (y - page.offsetTop) / page.offsetHeight));
    }
    return 0;
  }

  // 繰り返しの印を描く (描けたページの分だけ)
  function drawPdfRepeats() {
    pdfElement.querySelectorAll(".pdfRepeat").forEach(function (c) { c.remove(); });
    if (pdfPages.length === 0) return;
    const mark = function (pos, text, pending) {
      if (Math.floor(pos) >= pdfPages.length) return;   // まだ描いていないページ
      const line = document.createElement("div");
      line.className = "pdfRepeat" + (pending ? " pending" : "");
      line.style.top = pdfPosToY(pos) + "px";
      const label = document.createElement("span");
      label.textContent = text;
      line.appendChild(label);
      pdfElement.appendChild(line);
    };
    pdfRepeats.forEach(function (r) {
      mark(r.start, "繰り返し ここから", false);
      mark(r.end, "ここまで ×" + r.count, false);
    });
    if (pdfPendingStart >= 0) mark(pdfPendingStart, "繰り返し ここから (終わりを右クリックで)", true);
  }

  // 読んでいる線が、流した距離 (px) でどこにいるか。繰り返しの終わりに来たら始めへ戻る
  function pdfLineY(distance) {
    let y = scroller.clientHeight * pdfReadingLine;
    let left = distance;
    for (const r of pdfRepeats) {
      const s = pdfPosToY(r.start), e = pdfPosToY(r.end);
      if (e <= y) continue;                       // もう過ぎた (読んでいる線より上にある) 繰り返し
      if (left <= e - y) return y + left;
      left -= e - y;
      const length = e - Math.min(s, e - 1);
      const extra = (r.count - 1) * length;       // 戻ってもう一度弾く分
      if (left < extra) return e - length + (left % length);
      left -= extra;
      y = e;
    }
    return y + left;
  }

  let pdfResizeTimer = 0;
  window.addEventListener("resize", function () {
    if (!pdfDoc) return;
    clearTimeout(pdfResizeTimer);
    pdfResizeTimer = setTimeout(function () {
      if (Math.abs(scroller.clientWidth - 24 - pdfRenderedWidth) > 4) renderPdfPages();
    }, 250);
  });

  function setPdfPosition(seconds, bpm, offset) {
    if (!pdfDoc || pdfPages.length === 0 || bpm <= 0) return;
    // 流した距離 = 拍 ÷ (100% のときの画面1つ分の拍) × 画面の高さ × 速さ
    const beats = Math.max(0, (seconds - offset) * bpm / 60);
    const distance = beats / (pdfBarsPerScreenAt100 * 4) * scroller.clientHeight * pdfSpeed;
    const y = pdfLineY(distance);

    // 再生中は、読んでいる線が画面の上から 3 割のところに来るように流す (止まっているときは、作者がスクロールしたままにする)
    if (clock.playing)
      scroller.scrollTop = Math.max(0, y - scroller.clientHeight * pdfReadingLine);
  }

  // 再生位置 (秒) から、今の小節と小節の中の位置を求めて、カーソルを動かす
  // ---- タブ譜の音 (MIDI) ----
  // アプリから: 鳴らすトラック (リード・バッキング) と、その音量・ミュート。ほかのトラックは鳴らさない
  let midiTracks = [];
  let midiReady = false;

  // 演奏する順の小節を求める。alphaTab が MIDI を作るときと同じ方法 (MidiFileGenerator) で作り、
  // その「小節の表」(tickLookup) を読む。繰り返し・1番かっこ 2番かっこ・弱起の小節も、鳴る音とぴったり合う。
  // 位置は MIDI の単位 (4分音符 = 960) なので、960 で割って拍にする。うまくいかなければ、楽譜の順に並べる
  function computePlayOrder(s) {
    barStartBeats = []; barIndex = []; scoreEndBeats = 0;
    try {
      const midiFile = new alphaTab.midi.MidiFile();
      const generator = new alphaTab.midi.MidiFileGenerator(s, api.settings, new alphaTab.midi.AlphaSynthMidiFileHandler(midiFile));
      generator.generate();
      for (const m of generator.tickLookup.masterBars) {
        barStartBeats.push(m.start / 960);
        barIndex.push(m.masterBar.index);
        scoreEndBeats = Math.max(scoreEndBeats, m.end / 960);
      }
    } catch (e) {
      barStartBeats = []; barIndex = [];
    }
    if (barStartBeats.length > 0) return;

    let beats = 0;
    s.masterBars.forEach(function (mb, i) {
      barStartBeats.push(beats);
      barIndex.push(i);
      beats += mb.timeSignatureNumerator * 4 / mb.timeSignatureDenominator;
    });
    scoreEndBeats = beats;
  }

  // 当て直しの途中で、alphaTab が MIDI の知らせ (midiLoaded) を出すことがある。その中でまた当て直すと終わらないので、入れ子にしない
  let applyingMidi = false;
  function applyMidiTracks() {
    if (!api || !score || !midiReady || applyingMidi) return;
    applyingMidi = true;
    try {
      const listed = {};
      for (const t of midiTracks) listed[t.index] = t;
      for (let i = 0; i < score.tracks.length; i++) {
        const t = listed[i];
        api.changeTrackMute([score.tracks[i]], !t || t.muted);
        if (t) api.changeTrackVolume([score.tracks[i]], t.volume);
      }
    } finally {
      applyingMidi = false;
    }
  }

  // アプリの再生に合わせて鳴らす。位置は拍で合わせる (アプリの BPM とずらしで、カーソルと同じ計算)。
  // 速さは「アプリの速度 × アプリの BPM ÷ タブ譜のテンポ」。
  //
  // 【ガタガタ・音割れの原因だったこと】alphaTab は、再生の速さ (playbackSpeed) を変えるたびに、
  // 中でその位置へ移動し直し、作ってあった音を捨てる (AlphaSynth.updatePlaybackSpeed → timePosition → seek)。
  // 前は、ずれを直すために速さを 0.1 秒ごとに少しずつ変えていたので、そのたびに音が途切れていた。
  // 今は:
  //   - 速さを変えるのは、アプリの速度・BPM が変わったときだけ
  //   - ずれは、届くたびの値をならして (ばらつきを消して) 見る。大きくずれたときだけ位置を合わせ直す
  //   - 合わせ直したあと 2 秒は、合わせ直さない (alphaTab の位置の知らせが追いつくのを待つ)
  const midiJumpSeconds = 0.12, midiJumpCooldownMs = 2000;
  let midiDrift = 0, midiLastJumpAt = 0, midiSpeed = 0;

  function setMidiSpeed(speed) {
    if (Math.abs(midiSpeed - speed) < 0.0005) return;
    midiSpeed = speed;
    api.playbackSpeed = speed;
  }

  function jumpMidi(tick) {
    api.tickPosition = tick;
    midiDrift = 0;
    midiLastJumpAt = performance.now();
  }

  function syncMidi(seconds, bpm, offset, rate, playing) {
    if (!api || !score || !midiReady || !api.isReadyForPlayback) return;

    const beats = (seconds - offset) * bpm / 60;
    const anyTrack = midiTracks.some(function (t) { return !t.muted && t.volume > 0; });
    const playingNow = api.playerState === 1;   // alphaTab の PlayerState.Playing

    if (!playing || !anyTrack || beats < 0 || bpm <= 0) {
      if (playingNow) api.pause();
      return;
    }

    const scoreTempo = score.tempo > 0 ? score.tempo : bpm;
    const speed = Math.max(0.1, rate * bpm / scoreTempo);
    const tick = beats * 960;   // MIDI の位置 (4分音符 = 960)

    if (!playingNow) {
      applyMidiTracks();   // 鳴らす前に、トラックのミュート・音量を確かめる
      midiSpeed = 0;       // 止まっている間に alphaTab の側で変わっていてもよいように、必ず設定し直す
      setMidiSpeed(speed);
      jumpMidi(tick);
      api.play();
      return;
    }

    // 速度・BPM が変わったとき (変わったときだけ。上の【原因】を参照)
    if (Math.abs(midiSpeed - speed) >= 0.0005) {
      setMidiSpeed(speed);
      jumpMidi(tick);
      return;
    }

    // ずれ (秒)。プラス = MIDI が先に進んでいる。alphaTab の位置の知らせは飛び飛びなので、ならして見る
    const drift = (api.tickPosition - tick) / 960 * 60 / bpm;
    midiDrift = midiDrift * 0.7 + drift * 0.3;

    const now = performance.now();
    if (Math.abs(drift) > 1.0 || (Math.abs(midiDrift) > midiJumpSeconds && now - midiLastJumpAt > midiJumpCooldownMs))
      jumpMidi(tick);   // 移動・ループで戻ったとき (大きくずれた) は、すぐに合わせる
  }

  // ---- 再生位置 ----
  // アプリからの位置の報告は、届く間隔がばらつく (1秒に約10回)。届いたときに針を置くだけだと、ガタガタ進む。
  // そこで、報告の間はこのページで「最後の位置 + 経過時間 × 速度」で針を進め、画面の更新 (requestAnimationFrame) ごとに描く。
  // 報告とのずれが小さいときは少しずつ寄せ、大きいとき (移動したとき) はすぐに合わせる
  let clock = { seconds: 0, at: 0, rate: 1, playing: false };
  let timing = { bpm: 120, offset: 0 };
  let animating = false;

  function currentSeconds(now) {
    return clock.playing ? clock.seconds + (now - clock.at) / 1000 * clock.rate : clock.seconds;
  }

  function receivePosition(cmd) {
    const now = performance.now();
    const predicted = currentSeconds(now);
    const playing = !!cmd.playing, rate = cmd.rate > 0 ? cmd.rate : 1;

    if (playing && clock.playing && Math.abs(cmd.seconds - predicted) < 0.25)
      clock = { seconds: predicted + (cmd.seconds - predicted) * 0.15, at: now, rate: rate, playing: true };
    else
      clock = { seconds: cmd.seconds, at: now, rate: rate, playing: playing };

    timing = { bpm: cmd.bpm, offset: cmd.offset };
    setPosition(clock.seconds, timing.bpm, timing.offset);
    syncMidi(clock.seconds, cmd.bpm, cmd.offset, rate, playing);   // なめらかにした位置で合わせる

    if (playing && !animating) {
      animating = true;
      requestAnimationFrame(animate);
    }
  }

  function animate() {
    if (!clock.playing) { animating = false; return; }
    setPosition(currentSeconds(performance.now()), timing.bpm, timing.offset);
    requestAnimationFrame(animate);
  }

  let scrolledToLine = -1;

  function setPosition(seconds, bpm, offset) {
    if (pdfDoc) { setPdfPosition(seconds, bpm, offset); return; }
    if (!api || !score || !api.renderer || !api.renderer.boundsLookup || barStartBeats.length === 0) return;

    const beats = Math.max(0, (seconds - offset) * bpm / 60);
    let index = 0;
    while (index + 1 < barStartBeats.length && barStartBeats[index + 1] <= beats) index++;

    const barEnd = index + 1 < barStartBeats.length ? barStartBeats[index + 1] : Math.max(scoreEndBeats, barStartBeats[index] + 1);
    const barLength = Math.max(0.001, barEnd - barStartBeats[index]);
    const fraction = Math.min(1, Math.max(0, (beats - barStartBeats[index]) / barLength));

    // 針は、演奏する順の小節ではなく、楽譜の上のその小節に置く (繰り返しの2回目は、同じ小節にもう一度戻る)
    const bounds = api.renderer.boundsLookup.findMasterBarByIndex(barIndex[index]);
    if (!bounds) return;

    const v = bounds.visualBounds, line = bounds.lineAlignedBounds || bounds.realBounds;
    cursor.style.left = (v.x + v.w * fraction) + "px";
    cursor.style.top = line.y + "px";
    cursor.style.height = line.h + "px";
    cursor.style.opacity = 1;

    barHighlight.style.left = v.x + "px"; barHighlight.style.top = line.y + "px";
    barHighlight.style.width = v.w + "px"; barHighlight.style.height = line.h + "px";
    barHighlight.style.opacity = 0.08;

    // カーソルの行が見えなくなりそうなら、自動でスクロールする (同じ行では1回だけ。毎フレーム頼むと動きが止まるため)
    const top = line.y, bottom = line.y + line.h;
    if (top !== scrolledToLine && (top < scroller.scrollTop + 20 || bottom > scroller.scrollTop + scroller.clientHeight - 20)) {
      scrolledToLine = top;
      scroller.scrollTo({ top: Math.max(0, top - 40), behavior: "smooth" });
    }
  }

  // ラジアルメニュー (アプリ側): マウスの左右を同時に押し続けると開く。その操作のあとで、
  // 離したときの「クリック」(小節から再生) や、右クリックのメニューが動かないようにする
  let twoButtons = false;
  document.addEventListener("mousedown", function (e) {
    if ((e.buttons & 3) === 3) { twoButtons = true; e.preventDefault(); }
  }, true);
  document.addEventListener("dragstart", function (e) { e.preventDefault(); }, true);
  // アプリのメニュー (PDF の右クリックのメニューなど) は、このページ (別の窓) のクリックに気づかないので、
  // 押したことを知らせて閉じてもらう (作者の指示: メニューの外を押したら消える)
  document.addEventListener("pointerdown", function () { send("pagePointerDown"); }, true);
  document.addEventListener("mouseup", function (e) {
    if (twoButtons && (e.buttons & 3) === 0) setTimeout(function () { twoButtons = false; }, 0);   // click の後で戻す
  }, true);
  document.addEventListener("contextmenu", function (e) { if (twoButtons || (e.buttons & 1)) e.preventDefault(); }, true);
  // 真ん中のボタンでもラジアルメニューを開く。押したときの自動スクロール (丸い印が出るもの) を止める
  document.addEventListener("mousedown", function (e) { if (e.button === 1) e.preventDefault(); }, true);
  document.addEventListener("auxclick", function (e) { if (e.button === 1) e.preventDefault(); }, true);

  // 小節をクリックしたら、その小節の頭から再生できるように、アプリに知らせる
  scoreElement.addEventListener("click", function (e) {
    if (twoButtons) return;   // ラジアルメニューの操作だった
    // 編集中: 押した場所を選ぶ。音の無い弦なら、そこに 0 フレットの音を入れる (作者の指示)。小節へは移動しない
    if (editSel && editable && score) {
      const r = scoreElement.getBoundingClientRect();
      const place = placeAt(e.clientX - r.left, e.clientY - r.top);
      if (place) {
        startEdit(place.beat, place.string);
        if (!place.beat.getNoteOnString(place.string)) typeFret(0);
      }
      return;
    }
    if (!api || !score || !api.renderer || !api.renderer.boundsLookup || barStartBeats.length === 0) return;
    const rect = scoreElement.getBoundingClientRect();
    // 編集モードの間は、クリックで編集する場所を選ぶ (再生の位置は動かさない)
    if (editSel) {
      const place = placeAt(e.clientX - rect.left, e.clientY - rect.top);
      if (place) startEdit(place.beat, place.string);
      return;
    }
    const beat = api.renderer.boundsLookup.getBeatAtPos(e.clientX - rect.left, e.clientY - rect.top);
    if (!beat || !beat.voice || !beat.voice.bar || !beat.voice.bar.masterBar) return;
    // 繰り返しのある曲では、同じ小節を何度も弾く。今の位置にいちばん近い回を選ぶ
    // (2回目を弾いているときにクリックしたら、2回目のその小節へ)
    const clicked = beat.voice.bar.masterBar.index;
    const nowBeats = Math.max(0, (currentSeconds(performance.now()) - timing.offset) * timing.bpm / 60);
    let best = -1;
    for (let i = 0; i < barIndex.length; i++)
      if (barIndex[i] === clicked && (best < 0 || Math.abs(barStartBeats[i] - nowBeats) < Math.abs(barStartBeats[best] - nowBeats)))
        best = i;
    if (best >= 0)
      send("barClicked", { bar: best, beats: barStartBeats[best] });
  });

  // PDF の右クリック: 繰り返しを置くメニューをアプリに出してもらう (ラジアルメニューの操作のときは出さない)。
  // 押した場所 (ページ + 割合) と、そこを含む繰り返しの番号 (無ければ -1) を送る
  pdfElement.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    if (twoButtons || (e.buttons & 1) || pdfPages.length === 0) return;
    const pos = pdfYToPos(e.clientY - pdfElement.getBoundingClientRect().top);
    let repeat = -1;
    pdfRepeats.forEach(function (r, i) { if (pos >= r.start && pos <= r.end) repeat = i; });
    send("pdfContext", { pos: pos, repeat: repeat });
  });

  // 再生の操作キーは、タブ譜の上で押してもアプリに渡す (WebView がキーを受け取ってしまうため)
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Enter" || e.code === "Home") {
      e.preventDefault();   // スペースでページがスクロールしないように
      send("key", { key: e.code });
    }
  });

  // ---- タブ譜の編集 (作者の指示。Guitar Pro 7 以降の .gp だけ) ----
  // タブ譜をダブルクリックすると編集モードに入り、押した拍・弦を枠で囲む (音が無い弦も選べる)。
  //   数字キー: その弦のフレットを変える。音が無ければ、その数字の音を足す (続けて押すと2桁。1 → 2 で 12)
  //   Delete・Backspace: その弦の音を消す (拍の音が無くなると休符になる)
  //   Ctrl+Z: 元に戻す   Ctrl+Y・Ctrl+Shift+Z: やり直す (編集モードの外でも効く)
  //   ←→: 前・次の拍へ (小節をまたぐ)   ↑↓: 上・下の弦へ   クリック: 押した場所へ
  //   Esc・Enter: 編集モードを終わる   Space: 再生・停止 (いつもどおり)
  // 変えるたびにアプリに知らせ (noteEdited)、アプリが「保存」のときに .gp のファイルへ書き込む。
  // 元に戻す・やり直すも、逆の編集としてアプリに知らせる (アプリが、すぐ前の編集とまとめる)
  let editable = false;   // 今のタブ譜を編集できるか (アプリが読み込みの命令で知らせる)
  let editSel = null;     // 編集中の場所 { beat, string }。null = 編集モードではない
  let fretBuffer = "", fretBufferAt = 0;
  let undoStack = [], redoStack = [];
  let keepAfterLoad = null;   // 挿入のあとの読み直しで、描き終えたら戻すもの { scroll, place, editing }
  let midiRebuildTimer = 0;
  const maxFret = 30;
  const editBox = document.createElement("div"); editBox.id = "editBox";
  const editHint = document.createElement("div"); editHint.id = "editHint";
  editHint.textContent = "編集中: 数字でフレット・音の無い弦をクリックで音を入れる・右クリックで拍・小節を挿入・Delete で消す・Ctrl+Z で戻す・矢印で移動・Esc で終わる (保存はアプリの保存ボタン)";
  document.body.appendChild(editHint);

  function stringCount(beat) {
    const staff = beat.voice.bar.staff;
    return staff.tuning ? staff.tuning.length : 0;
  }

  // 選んでいる場所の四角 (タブ譜の中の座標)。音があれば音の数字、無ければ弦の線の上
  function selectionBounds() {
    const lookup = api && api.renderer ? api.renderer.boundsLookup : null;
    if (!editSel || !lookup) return null;
    const beatBounds = lookup.findBeat(editSel.beat);
    if (!beatBounds) return null;
    const note = editSel.beat.getNoteOnString(editSel.string);
    if (note && beatBounds.notes)
      for (const nb of beatBounds.notes) if (nb.note === note) return nb.noteHeadBounds;
    // 弦の線: 小節の線の範囲 (visualBounds) を、弦の数で等分する (alphaTab の描き方と同じ。確かめた)
    const bar = beatBounds.barBounds ? beatBounds.barBounds.visualBounds : null;
    const strings = stringCount(editSel.beat);
    if (!bar || strings < 2) return null;
    const y = bar.y + (strings - editSel.string) * bar.h / (strings - 1);
    const x = typeof beatBounds.onNotesX === "number" ? beatBounds.onNotesX : beatBounds.visualBounds.x + beatBounds.visualBounds.w / 2;
    return { x: x - 7, y: y - 7, w: 14, h: 14 };
  }

  // 編集する場所の枠を、今の描かれた場所に置く (描き直したあとも呼ぶ)
  function placeEditBox(scrollIntoView) {
    const b = selectionBounds();
    if (!b) { editBox.style.display = "none"; return; }
    if (editBox.parentNode !== scoreElement) scoreElement.appendChild(editBox);
    const pad = 4;
    editBox.style.display = "block";
    editBox.style.left = (b.x - pad) + "px"; editBox.style.top = (b.y - pad) + "px";
    editBox.style.width = (b.w + pad * 2) + "px"; editBox.style.height = (b.h + pad * 2) + "px";
    if (scrollIntoView) {
      const top = b.y - 60, bottom = b.y + b.h + 60;
      if (top < scroller.scrollTop) scroller.scrollTop = Math.max(0, top);
      else if (bottom > scroller.scrollTop + scroller.clientHeight) scroller.scrollTop = bottom - scroller.clientHeight;
    }
  }

  function startEdit(beat, string) {
    const wasEditing = !!editSel;
    editSel = { beat: beat, string: string }; fretBuffer = "";
    placeEditBox(true);
    editHint.style.display = "block";
    if (!wasEditing) send("editMode", { on: true });
  }

  function endEdit() {
    if (!editSel) return;
    editSel = null; fretBuffer = "";
    editBox.style.display = "none";
    editHint.style.display = "none";
    send("editMode", { on: false });
  }

  // 編集できる拍か (ファイルに無い、alphaTab が補った空の拍は除く)
  function isEditableBeat(beat) { return !!beat && !beat.isEmpty && stringCount(beat) > 0 && !beat.voice.bar.staff.isPercussion; }

  // 画面の上の位置 (タブ譜の中の座標) の拍と弦。段の外なら null
  function placeAt(x, y) {
    const lookup = api && api.renderer ? api.renderer.boundsLookup : null;
    if (!lookup) return null;
    const beat = lookup.getBeatAtPos(x, y);
    if (!isEditableBeat(beat)) return null;
    const hit = lookup.getNoteAtPos(beat, x, y);
    if (hit) return { beat: beat, string: hit.string };
    const beatBounds = lookup.findBeat(beat);
    const bar = beatBounds && beatBounds.barBounds ? beatBounds.barBounds.visualBounds : null;
    const strings = stringCount(beat);
    if (!bar || strings < 2) return null;
    const spacing = bar.h / (strings - 1);
    if (y < bar.y - spacing || y > bar.y + bar.h + spacing) return null;   // 段から離れたところ
    const string = Math.round(strings - (y - bar.y) / spacing);
    return { beat: beat, string: Math.max(1, Math.min(strings, string)) };
  }

  // ファイルの中の場所 (アプリが .gp の score.gpif の同じ場所を探すのに使う。GpScoreEdit.h)
  function beatLocation(beat, string) {
    const voice = beat.voice, bar = voice.bar, staff = bar.staff, track = staff.track;
    let slot = staff.index;
    for (let i = 0; i < track.index; i++) slot += score.tracks[i].staves.length;
    return { slot: slot, bar: bar.index, voice: voice.index, beat: beat.index, string: string };
  }

  // 各弦の開放の音の高さ (MIDI。[0] が弦 1 = いちばん低い弦)。アプリが、足す音の高さを決めるのに使う
  function tuningByString(beat) {
    const tuning = beat.voice.bar.staff.tuning || [];
    const out = [];
    for (let s = 1; s <= tuning.length; s++) out.push(tuning[tuning.length - s]);
    return out;
  }

  // 拍の音を足した・消したあとに、alphaTab が音から決めておく値を作り直す (描き方・音の長さの線に使う)
  function refreshBeat(beat) {
    beat.notes.forEach(function (n, i) { n.index = i; });
    beat.minNote = beat.maxNote = beat.minStringNote = beat.maxStringNote = null;
    for (const n of beat.notes) {
      if (!beat.minNote || n.realValue < beat.minNote.realValue) beat.minNote = n;
      if (!beat.maxNote || n.realValue > beat.maxNote.realValue) beat.maxNote = n;
      if (!beat.minStringNote || n.string < beat.minStringNote.string) beat.minStringNote = n;
      if (!beat.maxStringNote || n.string > beat.maxStringNote.string) beat.maxStringNote = n;
    }
  }

  // ---- 編集の操作 ----
  // 1回の操作 (数字・Delete) は、いくつかの「手順」でできている (タイでつながった音も一緒に変えるため)。
  // 手順は、モデルを変えてアプリに知らせる。元に戻すときは、手順を逆の順に、逆向きに行う
  //   set: フレットを変える   add・remove: 音を足す・消す   tie: タイでつながった2つの音を、つなぐ・切る
  function sendNote(beat, string, fields) {
    const loc = beatLocation(beat, string);
    for (const k in fields) loc[k] = fields[k];
    send("noteEdited", loc);
  }

  function runStep(step, forward) {
    if (step.t === "set") {
      const to = forward ? step.to : step.from, from = forward ? step.from : step.to;
      step.beat.getNoteOnString(step.string).fret = to;
      sendNote(step.beat, step.string, { kind: "set", oldFret: from, fret: to });
    } else if (step.t !== "tie" && (step.t === "add") === forward) {
      // 足す (add を進める・remove を戻す)。消した音を戻すときは、同じ音 (奏法も) を戻す
      const note = step.note || new alphaTab.model.Note();
      note.string = step.string; note.fret = step.fret;
      step.beat.addNote(note);
      if (!step.note) {
        try { note.dynamics = step.beat.dynamics; note.finish(api.settings, new Map()); } catch (e) { /* 音の飾りの準備だけ */ }
        step.note = note;
      }
      refreshBeat(step.beat);
      sendNote(step.beat, step.string, { kind: "add", fret: step.fret, tuning: tuningByString(step.beat) });
    } else if (step.t === "add" || step.t === "remove") {
      step.beat.removeNote(step.note);
      refreshBeat(step.beat);
      sendNote(step.beat, step.string, { kind: "remove", oldFret: step.fret });
    } else if (step.t === "tie") {
      // origin (始め) と destination (終わり) の2つの音を、つなぐ (link) か切る
      const link = forward ? step.link : !step.link;
      const o = step.origin, d = step.destination;
      const before = { o: [!!o.tieOrigin(), !!o.tieDest()], d: [!!d.tieOrigin(), !!d.tieDest()] };
      const on = o.beat.getNoteOnString(o.string), dn = d.beat.getNoteOnString(d.string);
      if (link) { on.tieDestination = dn; dn.tieOrigin = on; dn.isTieDestination = true; }
      else { on.tieDestination = null; dn.tieOrigin = null; dn.isTieDestination = false; }
      const sendOrigin = function () {
        sendNote(o.beat, o.string, { kind: "tie", origin: on.tieDestination !== null, destination: !!on.isTieDestination,
                                      oldOrigin: before.o[0], oldDestination: before.o[1] });
      };
      const sendDestination = function () {
        sendNote(d.beat, d.string, { kind: "tie", origin: dn.tieDestination !== null, destination: !!dn.isTieDestination,
                                      oldOrigin: before.d[0], oldDestination: before.d[1] });
      };
      // 元に戻すときは逆の順に送る (アプリが、すぐ前の編集と打ち消し合わせて、戻しきったら「未保存」を消せるように)
      if (forward) { sendOrigin(); sendDestination(); } else { sendDestination(); sendOrigin(); }
    }
  }

  // タイの手順で使う、音の場所 (音そのものは、消して戻すと別の物になることがあるので、拍と弦で持つ)
  function notePlace(note) {
    return { beat: note.beat, string: note.string,
             tieOrigin: function () { const n = this.beat.getNoteOnString(this.string); return n && n.tieDestination !== null; },
             tieDest: function () { const n = this.beat.getNoteOnString(this.string); return n && n.isTieDestination; } };
  }

  function untieSteps(origin, destination) {
    return { t: "tie", link: false, origin: notePlace(origin), destination: notePlace(destination) };
  }

  // 操作を行って記録する (やり直しの記録は消す)
  function perform(steps) {
    if (steps.length === 0) return;
    for (const s of steps) runStep(s, true);
    undoStack.push({ steps: steps, beat: editSel.beat, string: editSel.string });
    redoStack = [];
    afterEdit();
  }

  function typeFret(fret) {
    const beat = editSel.beat, string = editSel.string;
    const note = beat.getNoteOnString(string);
    if (!note) {
      perform([{ t: "add", beat: beat, string: string, fret: fret, note: null }]);
      return;
    }
    if (note.fret === fret) return;

    const steps = [];
    // タイの終わりの音: 前の音と同じ高さでなくなるので、タイを切る
    if (note.isTieDestination && note.tieOrigin) {
      const s = untieSteps(note.tieOrigin, note);
      runStep(s, true); steps.push(s);
    }
    // この音と、タイでつながった後ろの音 (同じ高さ) のフレットを変える
    for (let n = note; n; n = n.tieDestination) {
      const s = { t: "set", beat: n.beat, string: n.string, from: n.fret, to: fret };
      runStep(s, true); steps.push(s);
    }
    undoStack.push({ steps: steps, beat: beat, string: string });
    redoStack = [];
    afterEdit();
  }

  function deleteNote() {
    const beat = editSel.beat, string = editSel.string;
    const note = beat.getNoteOnString(string);
    if (!note) return;
    const steps = [];
    // タイでつながった前・後ろの音とのタイを切ってから消す (残った音が、別の音とつながらないように)
    if (note.tieDestination) { const s = untieSteps(note, note.tieDestination); runStep(s, true); steps.push(s); }
    if (note.isTieDestination && note.tieOrigin) { const s = untieSteps(note.tieOrigin, note); runStep(s, true); steps.push(s); }
    const remove = { t: "remove", beat: beat, string: string, fret: note.fret, note: note };
    runStep(remove, true); steps.push(remove);
    undoStack.push({ steps: steps, beat: beat, string: string });
    redoStack = [];
    afterEdit();
  }

  function afterEdit() {
    api.render();   // 描き直す (枠は描き終わったときに置き直す)
    // タブ譜の音 (MIDI) も作り直す。続けて押したときに何度も作らないよう、少し待つ
    clearTimeout(midiRebuildTimer);
    midiRebuildTimer = setTimeout(function () {
      if (!api || !score) return;
      try { api.loadMidiForScore(); } catch (e) { /* 音が作れなくても、編集は続ける */ }
    }, 400);
  }

  // 元に戻す (Ctrl+Z): 手順を逆の順に、逆向きに。やり直す (Ctrl+Y): もう一度。どちらも、その場所を選ぶ
  function undoEdit() {
    const a = undoStack.pop();
    if (!a) { send("undoInsert"); return; }   // このページで戻せるものが無い: 拍・小節の挿入を戻すかは、アプリが決める
    for (let i = a.steps.length - 1; i >= 0; i--) runStep(a.steps[i], false);
    redoStack.push(a);
    if (editSel) { editSel = { beat: a.beat, string: a.string }; fretBuffer = ""; }
    afterEdit();
  }

  function redoEdit() {
    const a = redoStack.pop();
    if (!a) return;
    for (const s of a.steps) runStep(s, true);
    undoStack.push(a);
    if (editSel) { editSel = { beat: a.beat, string: a.string }; fretBuffer = ""; }
    afterEdit();
  }

  // 同じ譜表・同じ声部の、前・次の拍 (小節をまたぐ。休符にも止まる: 音を足せるように)
  function stepBeat(direction) {
    const voiceIndex = editSel.beat.voice.index, staff = editSel.beat.voice.bar.staff;
    let barIndex = editSel.beat.voice.bar.index, beatIndex = editSel.beat.index + direction;
    while (barIndex >= 0 && barIndex < staff.bars.length) {
      const voice = staff.bars[barIndex].voices[voiceIndex];
      const beats = voice ? voice.beats : [];
      if (beatIndex === Infinity) beatIndex = beats.length - 1;
      for (; beatIndex >= 0 && beatIndex < beats.length; beatIndex += direction)
        if (isEditableBeat(beats[beatIndex])) return beats[beatIndex];
      barIndex += direction;
      beatIndex = direction > 0 ? 0 : Infinity;
    }
    return null;
  }

  function moveEdit(key) {
    if (key === "ArrowLeft" || key === "ArrowRight") {
      const beat = stepBeat(key === "ArrowRight" ? 1 : -1);
      if (beat) startEdit(beat, Math.min(editSel.string, stringCount(beat)));
    } else {
      // ↑: 画面で上 (高い弦 = 番号が大きい)、↓: 画面で下
      const string = editSel.string + (key === "ArrowUp" ? 1 : -1);
      if (string >= 1 && string <= stringCount(editSel.beat)) startEdit(editSel.beat, string);
    }
  }

  // ファイルの中の場所 (beatLocation の逆) の拍。無ければ null
  function beatAtLocation(loc) {
    if (!score) return null;
    let slot = 0;
    for (const track of score.tracks)
      for (const staff of track.staves) {
        if (slot++ !== loc.slot) continue;
        const bar = staff.bars[loc.bar];
        const voice = bar ? bar.voices[loc.voice] : null;
        return voice ? voice.beats[loc.beat] || null : null;
      }
    return null;
  }

  // 挿入のあとの読み直しが描き終わった: スクロールを戻し、keep の場所を選んで編集を続ける
  function restoreAfterReload() {
    const keep = keepAfterLoad;
    keepAfterLoad = null;
    scroller.scrollTop = keep.scroll;
    const beat = beatAtLocation(keep.place);
    if (keep.editing && isEditableBeat(beat)) {
      editSel = { beat: beat, string: Math.max(1, Math.min(stringCount(beat), keep.place.string)) };
      fretBuffer = "";
      editHint.style.display = "block";
      placeEditBox(true);
    } else if (keep.editing) {
      endEditNotify();
    }
  }

  // 選べる場所が無くなったとき: 編集モードを終える (アプリにも知らせる)
  function endEditNotify() {
    editSel = {};   // endEdit が「編集中だった」とみなして知らせるように
    endEdit();
  }

  // 編集中の右クリック: 押した場所を選び、アプリに拍・小節の挿入のメニューを出してもらう (作者の指示)
  scoreElement.addEventListener("contextmenu", function (e) {
    if (!editable || !editSel || !score) return;
    e.preventDefault();
    if (twoButtons) return;   // ラジアルメニューの操作だった
    const rect = scoreElement.getBoundingClientRect();
    const place = placeAt(e.clientX - rect.left, e.clientY - rect.top);
    if (place) startEdit(place.beat, place.string);
    const loc = beatLocation(editSel.beat, editSel.string);
    loc.tuning = tuningByString(editSel.beat);
    send("editContext", loc);
  });

  scoreElement.addEventListener("dblclick", function (e) {
    if (!editable || twoButtons || !score) return;
    const rect = scoreElement.getBoundingClientRect();
    const place = placeAt(e.clientX - rect.left, e.clientY - rect.top);
    if (place) startEdit(place.beat, place.string); else endEdit();
  });

  // 編集のキー (いつものキーの扱いより先に受け取る)
  document.addEventListener("keydown", function (e) {
    if (!editable || !score) return;

    // 元に戻す・やり直す: 編集モードの外でも効く (編集したあとに Esc で抜けてからでも戻せるように)
    if (e.ctrlKey && !e.altKey && (e.code === "KeyZ" || e.code === "KeyY")) {
      if (e.code === "KeyY" || e.shiftKey) redoEdit(); else undoEdit();
      e.preventDefault(); e.stopImmediatePropagation();
      return;
    }

    if (!editSel) return;
    const digit = /^(Digit|Numpad)([0-9])$/.exec(e.code);
    if (digit && !e.ctrlKey && !e.altKey) {
      const now = performance.now();
      const joined = fretBuffer + digit[2];
      fretBuffer = (fretBuffer && now - fretBufferAt < 1000 && +joined <= maxFret) ? joined : digit[2];
      fretBufferAt = now;
      typeFret(+fretBuffer);
    } else if (e.code === "Delete" || e.code === "Backspace") {
      fretBuffer = "";
      deleteNote();
    } else if (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "ArrowUp" || e.code === "ArrowDown") {
      moveEdit(e.code);
    } else if (e.code === "Escape" || e.code === "Enter" || e.code === "NumpadEnter") {
      endEdit();
    } else {
      return;   // Space などは、いつもどおりアプリへ
    }
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);

  document.addEventListener("DOMContentLoaded", function () { showMessage(""); send("pageReady"); });
</script>
</body>
</html>
