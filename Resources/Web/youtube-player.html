<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- YouTube の埋め込み再生 (設計書 v0.7 3.2、PoC-4)
     このページはアプリに同梱し、https://juce.backend/ の住所で開く。
     パソコン内のファイルとして開くと、YouTube に埋め込み先が伝わらず、再生を拒否される (エラー 153) -->
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--color-surface); color: var(--color-text-muted);
               font-family: var(--font-ui); font-size: var(--font-size-body); }
  #player, #message { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* 動画の上に透明な板を置き、マウスが YouTube に届かないようにする。
     YouTube はマウスが乗ると題名や操作の帯 (オーバーレイ) を出すため。再生の操作はアプリから行う */
  #shield { position: absolute; inset: 0; z-index: 10; }
  #message { display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--space-lg); box-sizing: border-box; }
  /* 再生前のカウントダウン (setlist-mode.md 7.2)。離れた位置からでも読める大きさ。
     すぐに始めるのはアプリの再生ボタンの2回押し。クリックは受けない (下のタブ譜をそのまま触れる) */
  #countdown { position: absolute; inset: 0; z-index: 100; display: none; flex-direction: column;
               align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45);
               pointer-events: none; user-select: none; }
  #countdown .number { font-size: min(55vh, 280px); font-weight: 700; line-height: 1; color: #fff;
                       font-family: var(--font-numeric), var(--font-ui); text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); }
  #countdown .caption { margin-top: 16px; font-size: 26px; font-weight: 700; color: #fff; text-align: center;
                        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
  #countdown .hint { margin-top: 8px; font-size: 15px; color: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
<div id="message">YouTube を準備しています…</div>
<div id="player"></div>
<div id="shield"></div>

<div id="countdown"><div class="number"></div><div class="caption"></div><div class="hint">▶ をもう一度押すと、すぐに始めます</div></div>
<script>
  // アプリ (C++) へ知らせる。JUCE が window.__JUCE__ を用意している
  function send(type, data) {
    if (window.__JUCE__ && window.__JUCE__.backend)
      window.__JUCE__.backend.emitEvent("player", Object.assign({ type: type }, data || {}));
  }

  // 再生前のカウントダウン。number が 0 で caption だけなら「読み込み中…」などの文字だけ、両方なければ消す
  function showCountdown(number, caption) {
    const c = document.getElementById("countdown");
    c.querySelector(".number").textContent = number > 0 ? number : "";
    c.querySelector(".number").style.display = number > 0 ? "" : "none";
    c.querySelector(".hint").style.display = number > 0 ? "" : "none";
    c.querySelector(".caption").textContent = caption || "";
    c.style.display = number > 0 || caption ? "flex" : "none";
  }

  function showMessage(text) {
    const m = document.getElementById("message");
    m.textContent = text;
    m.style.display = text ? "flex" : "none";
  }

  let player = null, apiReady = false, playerReady = false, pending = null;
  let warming = false, warmStart = 0;   // 先読み: 音を消して一瞬だけ再生している
  let loop = { a: 0, b: 0, on: false };
  let volume = 100;

  // ---- アプリからの命令 (C++ の evaluateJavascript で呼ばれる) ----
  window.playerCommand = function (cmd) {
    switch (cmd.type) {
      case "load":   load(cmd.videoId, cmd.start || 0); break;
      case "unload": pending = null; warming = false; if (playerReady) player.stopVideo(); showMessage(""); break;
      case "play":   if (playerReady) { endWarmUp(true); player.playVideo(); } break;
      case "warmUp": warmUp(); break;
      case "pause":  if (playerReady) player.pauseVideo(); break;
      case "countdown": showCountdown(cmd.number, cmd.caption); break;
      case "seek":   if (playerReady) player.seekTo(Math.max(0, cmd.seconds), true); break;
      case "rate":   if (playerReady) player.setPlaybackRate(cmd.rate); break;
      case "volume": volume = cmd.volume; if (playerReady && !warming) { player.unMute(); player.setVolume(volume); } break;
      case "loop":   loop = { a: cmd.a, b: cmd.b, on: cmd.on }; break;
    }
  };

  // 先読み: 動画は再生を始めるまで読み込まれないので、カウントダウン中に音を消して一瞬だけ再生し、すぐに止めて頭に戻す
  function warmUp() {
    if (!playerReady || warming || player.getPlayerState() === 1) return;
    warming = true;
    warmStart = player.getCurrentTime();
    player.mute();
    player.playVideo();
  }

  // 先読みを終える。startingNow: そのまま本当の再生を始める (位置だけ戻す)
  function endWarmUp(startingNow) {
    if (!warming) return;
    warming = false;
    if (!startingNow) player.pauseVideo();
    player.seekTo(warmStart, true);
    player.unMute();
    player.setVolume(volume);
  }

  function load(videoId, start) {
    if (!apiReady) { pending = { videoId: videoId, start: start }; return; }

    showMessage("");
    if (player) {
      player.cueVideoById({ videoId: videoId, startSeconds: start });
      return;
    }

    player = new YT.Player("player", {
      videoId: videoId,
      // controls: 0 … YouTube の操作の帯を出さない (操作はアプリから)。iv_load_policy: 3 … 動画内の注釈を出さない
      playerVars: { playsinline: 1, rel: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3,
                    start: Math.floor(start), origin: location.origin },
      events: {
        onReady: function () {
          playerReady = true;
          player.unMute();
          player.setVolume(volume);
          send("ready");
        },
        onStateChange: function (e) {
          if (warming && e.data === 1) endWarmUp(false);   // 再生が始まった = 読み込めた。止めて頭に戻す
          send("state", status());
        },
        onPlaybackRateChange: function () { send("state", status()); },
        onError: function (e) { send("error", { code: e.data }); }
      }
    });
  }

  function status() {
    return {
      // -1 未開始, 0 終了, 1 再生中, 2 一時停止, 3 読み込み中, 5 頭出し済み。先読み中は「頭出し済み」と伝える (アプリが再生中と思わないように)
      state: warming ? 5 : player.getPlayerState(),
      time: player.getCurrentTime(),
      duration: player.getDuration(),
      rate: player.getPlaybackRate()
    };
  }

  // 50ms ごとに: A-B ループの確認と、再生位置の報告 (アプリはこの値でメトロノームとタイムラインを動かす)
  setInterval(function () {
    if (!playerReady) return;
    const s = status();
    if (loop.on && loop.b > loop.a && s.state === 1 && s.time >= loop.b) {
      player.seekTo(loop.a, true);
      s.time = loop.a;
    }
    send("tick", s);
  }, 50);

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    send("apiReady");
    if (pending) { const p = pending; pending = null; load(p.videoId, p.start); }
  };

  // 再生の操作キーは、アプリに渡す。
  // ※ 動画 (YouTube の枠の中) をクリックした直後は、キーが YouTube に届き、ここでは受け取れない
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Enter" || e.code === "Home") {
      e.preventDefault();
      send("key", { key: e.code });
    }
  });

  document.addEventListener("DOMContentLoaded", function () { send("pageReady"); });
</script>
<!-- YouTube の公式プレイヤー API。これだけはネットから読む (YouTube を使うときはネット接続が必要) -->
<script src="https://www.youtube.com/iframe_api" async
        onerror="send('error', { code: 'offline' }); showMessage('YouTube に接続できません。インターネット接続を確認してください');"></script>
</body>
</html>
